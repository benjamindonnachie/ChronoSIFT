unmapped_notes:
  LUHN_SENSITIVE_DATA_HIT: 'Potential plaintext payment-card data merits investigation as exposure or possible dumping. PCI DSS v4.0.1 requirement 3.5.1 concerns stored PAN protection (https://www.pcisecuritystandards.org/faqs/1222/). A Luhn checksum alone does not establish genuine PAN, storage noncompliance or attacker access; no standalone ATT&CK credential-theft claim. Existing score is unchanged.'
  REFERENCED_FILE_LUHN_HIT: 'References potential plaintext payment-card content; investigate exposure and access context. Separately relevant: PCI DSS v4.0.1 requirement 3.5.1 (https://www.pcisecuritystandards.org/faqs/1222/). A checksum-supported reference alone proves neither genuine PAN nor exfiltration. Existing score is unchanged.'
  WINDOWS_NOTE_CREATED: A note-like basename without ransom content or qualified context does not establish encryption capability; T1486 prose is not automatically promoted.
  WINDOWS_UNATTRIBUTED_NOTE_CREATED: Unattributed note-like file alone does not establish a ransomware technique.
  WEBSHELL_NAME_HINT: A suggestive basename is a review hint, not sufficient technique-specific evidence for structured web-shell attribution.
  WEBSHELL_LEGACY_ARTIFACT: Legacy name-or-support union has ambiguous qualification; use the separately category-qualified web-shell producer.
  WEB_SCRIPT_ARTIFACT_CANDIDATE: Generic web-root script presence is not web-shell deployment.
  WEB_EXECUTABLE_FILE_CREATED: Generic executable web content may be legitimate; no web-shell technique is forced.
  DEFACEMENT_CANDIDATE: A web-root modification alone does not establish defacement; qualified follow-on has its own mapping.
  MASS_FILE_MODIFICATION: Modification bursts are not encryption evidence.
  WINDOWS_MALWARE_EXECUTION: Generic malware use does not identify encryption or another specific ATT&CK execution mechanism; per-hash capability metadata remains separate.
  WINDOWS_MALWARE_EXECUTION_CANDIDATE: AV-positive path/use context does not establish a ransomware family, capability or specific execution mechanism.
  WINDOWS_MALWARE_USE_PRIORITY: Priority aggregation spans malware categories; map qualified constituent findings rather than all category capabilities.
  QUALIFIED_MALWARE_PATH_USE: Generic qualified malware-to-use linkage does not identify a specific technique or prove file version at execution.
  QUALIFIED_MALWARE_EXACT_HASH_USE: Exact malware hash/use linkage is strong identity evidence, not by itself a specific payload technique.
  WINDOWS_SENSITIVE_CONTENT_ACCESS: 'Luhn-supported potential plaintext payment-card data is a meaningful exposure or possible dumping indicator, not necessarily a credential/secret (T1552.001). Separately relevant: PCI DSS v4.0.1 requirement 3.5.1 protects stored PAN (https://www.pcisecuritystandards.org/faqs/1222/). A checksum hit alone does not establish genuine PAN, noncompliance, access or exfiltration. Existing investigative score is retained.'
  WINDOWS_FTP_ACTIVITY: FTP cache/navigation lacks upload direction; do not turn navigation into exfiltration attribution.
  FTP_TRANSFER_OBSERVED: This producer includes incoming and outgoing transfers; direction-specific attribution belongs to the outbound producer.
  FTP_ARCHIVE_TRANSFER: Incoming archive transfer is not necessarily local staging or exfiltration; direction-qualified source explanation is authoritative.
  FTP_COMPLETED_ARCHIVE: Completion does not establish outbound direction or malicious intent.
  WEB_EXTERNAL_SENSITIVE_TRANSFER: Public sensitive download is concerning but does not alone identify an ATT&CK exfiltration channel.
  HOSTILE_CLIENT_SENSITIVE_WEB_DOWNLOAD: Prior hostile-client evidence is context, not proof that the current download executes an exploit or a particular exfiltration channel.
  CREDENTIAL_DUMP_COLLECTION: Source may be a generic offensive tool, so do not project credential dumping onto every branch.
  APPLICATION_LAYER_PROTOCOL: Application protocol presence is not proof of a command-and-control channel.
  WINDOWS_FIRST_OBSERVED_DUAL_USE_EXECUTION: Novelty spans multiple configured dual-use tools; do not project PsExec service-execution metadata onto every tool.
  WINDOWS_RECENT_PRIVILEGED_HOST_ACTION: This union includes security, archive and task actions; mapping all three techniques would misattribute whichever branches did not fire.
  LOLBIN_WINDOWS_EXEC: Dual-use binary vocabulary is broader than system-binary proxy execution; a tool name alone does not establish T1218.
  LOLBIN_WINDOWS_SUSPICIOUS_ARGS: Mixed encoded/download/proxy patterns need branch-qualified technique attribution, not a blanket T1218 label.
  LOLBIN_LINUX_EXEC: A dual-use executable name does not uniquely identify a technique.
  LOLBIN_LINUX_SUSPICIOUS_ARGS: Mixed shell and transfer patterns do not identify one technique in this aggregate producer.
  EXECUTION_LOLBIN: Aggregated dual-use-tool signal does not uniquely identify system-binary proxy execution.
  EXECUTION_LOLBIN_SUSPICIOUS_ARGS: Use the qualified source evidence; this aggregate does not distinguish proxy execution from download/encoding patterns.

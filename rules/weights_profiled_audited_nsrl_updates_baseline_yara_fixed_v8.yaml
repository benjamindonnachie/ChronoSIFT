  # YARA Forge category-specific signals.  When a YARA Forge metadata index
  # is loaded, the engine classifies each YARA match by forensic category
  # and emits category-specific signals alongside the existing yara_hit_strength.
  yara_offensive_tool: 10   # Mimikatz, Cobalt Strike, Rubeus, hacktools — confirms compromise
  yara_ransomware: 8        # Ransomware family binary — confirms impact context
  yara_webshell: 9           # Webshell detection — directly actionable
  yara_apt: 9                # APT-attributed malware — attribution-grade signal
  yara_exploit: 7            # Exploit/shellcode — confirms initial access or priv-esc
  yara_malware: 7            # Generic malware (trojan, backdoor, infostealer)
  yara_certificate_blocklist: 0  # Informational only — revoked cert, not inherently malicious

  # ClamAV category-specific signals.  When av_signature is present, the engine
  # parses the structured ClamAV name into forensic categories and emits
  # category-specific signals alongside the existing av_hit.
  av_offensive_tool: 10   # Mimikatz, Cobalt Strike, hacktools — confirms compromise
  av_ransomware: 9        # Ransomware family — confirms impact context
  av_exploit: 8            # Exploit/shellcode payload
  av_malware: 8            # Generic malware (trojan, backdoor, infostealer, RAT)
  av_pua: 2                # PUA/adware/coinminer — low forensic relevance
  av_webshell: 9            # Webshell detection — directly actionable

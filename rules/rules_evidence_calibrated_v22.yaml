    sources:
    - kind: windows_fields
      fields:
      - rdp_client_address
      - client_address
      - source_network_address
    - kind: windows_xml
      fields:
      - xml_string
    - kind: windows_strings
      fields:
      - strings
    - kind: text_fields
      fields:
      - url
      - http_request
      - http_headers
      - http_request_referer
      - http_request_user_agent
      require_context: false
    - kind: text_fields
      fields:
      - message
      - text
      require_context: true
normalisation:
- name: linux_sudo_actor
  method: regex_first
  from: message
  pattern: ^\s*(?:\[sudo(?:,\s*pid:\s*\d+)?\]|sudo\[\d+\]:)\s*([^\s:;]+)\s*:\s*(.+)$
  group: 1
  selector:
    field: parser
    pattern: ^(?:text/syslog_traditional|syslog|systemd_journal)$
- name: linux_sudo_detail
  method: regex_first
  from: message
  pattern: ^\s*(?:\[sudo(?:,\s*pid:\s*\d+)?\]|sudo\[\d+\]:)\s*([^\s:;]+)\s*:\s*(.+)$
  group: 2
  selector:
    field: parser
    pattern: ^(?:text/syslog_traditional|syslog|systemd_journal)$
- name: linux_sudo_allowed_detail
  method: regex_first
  from: linux_sudo_detail
  pattern: ^(TTY=([^;\r\n]+?)\s*;\s*PWD=(/[^;\r\n]*)\s*;\s*USER=([^;\s]+)\s*;\s*COMMAND=([^\r\n]+)$)$
  group: 1
- name: linux_sudo_denied_detail
  method: regex_first
  from: linux_sudo_detail
  pattern: ^(?:user NOT in sudoers|command not allowed|user NOT authorized on host|[0-9]+ incorrect password attempts?)\s*;\s*(TTY=([^;\r\n]+?)\s*;\s*PWD=(/[^;\r\n]*)\s*;\s*USER=([^;\s]+)\s*;\s*COMMAND=([^\r\n]+)$)$
  group: 1
- name: linux_sudo_known_detail
  method: coalesce
  fields:
  - linux_sudo_allowed_detail
  - linux_sudo_denied_detail
  overwrite_existing: true
- name: linux_sudo_tty
  method: regex_first
  from: linux_sudo_known_detail
  pattern: ^TTY=([^;\r\n]+?)\s*;\s*PWD=(/[^;\r\n]*)\s*;\s*USER=([^;\s]+)\s*;\s*COMMAND=([^\r\n]+)$
  group: 1
- name: linux_sudo_pwd
  method: regex_first
  from: linux_sudo_known_detail
  pattern: ^TTY=([^;\r\n]+?)\s*;\s*PWD=(/[^;\r\n]*)\s*;\s*USER=([^;\s]+)\s*;\s*COMMAND=([^\r\n]+)$
  group: 2
- name: linux_sudo_runas
  method: regex_first
  from: linux_sudo_known_detail
  pattern: ^TTY=([^;\r\n]+?)\s*;\s*PWD=(/[^;\r\n]*)\s*;\s*USER=([^;\s]+)\s*;\s*COMMAND=([^\r\n]+)$
  group: 3
- name: linux_sudo_command
  method: regex_first
  from: linux_sudo_known_detail
  pattern: ^TTY=([^;\r\n]+?)\s*;\s*PWD=(/[^;\r\n]*)\s*;\s*USER=([^;\s]+)\s*;\s*COMMAND=([^\r\n]+)$
  group: 4
- name: linux_sudo_allowed_command
  method: regex_first
  from: linux_sudo_command
  pattern: ^(.+)$
  group: 1
  selector:
    field: linux_sudo_allowed_detail
    pattern: .+
- name: linux_sudo_allowed_runas
  method: regex_first
  from: linux_sudo_runas
  pattern: ^(.+)$
  group: 1
  selector:
    field: linux_sudo_allowed_detail
    pattern: .+
- name: linux_sudo_executable_quoted
  method: regex_first
  from: linux_sudo_allowed_command
  pattern: ^"([^"\r\n]+)"(?:\s|$)
  group: 1
- name: linux_sudo_executable_bare
  method: regex_first
  from: linux_sudo_allowed_command
  pattern: ^([^\s"\x27]+)(?:\s|$)
  group: 1
- name: linux_sudo_executable
  method: coalesce
  fields:
  - linux_sudo_executable_quoted
  - linux_sudo_executable_bare
  overwrite_existing: true
- name: linux_sudo_path
  method: posix_path_resolve
  from: linux_sudo_executable
  base_field: linux_sudo_pwd
- name: evidence_userassist_path
  method: regex_first
  from: message
  pattern: (?i)(?:UEME_RUNPATH:|Value name:\s*)([a-z]:\\[^\r\n]+?\.exe)(?:\s+Count:|\s*$)
  group: 1
  stage: pre
  selector:
    field: parser
    pattern: (?i)userassist
- name: chronosift_web_history_stream
  method: regex_first
  from: parser
  pattern: (?i)^.*(?:apache|nginx|msiis|iis|w3c).*$
  group: 0
- name: chronosift_web_history_asset
  method: coalesce
  fields:
  - hostname
  - computer_name
  - host_name
  - chronosift_web_history_stream
- name: win_event_id
  method: regex_first
  from: event_identifier
  pattern: ^\s*(\d+)(?:\.0+)?\s*$
  group: 1
  selector:
    field: parser
    pattern: (?i)^winevt
- name: identity_event_provider
  method: coalesce
  fields:
  - provider_name
  - source_name
  overwrite_existing: true
- name: identity_event_key
  method: join_fields
  fields:
  - parser
  - identity_event_provider
  - win_event_id
  separator: '|'
- name: identity_target_qualified
  method: join_fields
  fields:
  - target_domain_name
  - target_user_name
  separator: \
- name: identity_subject_qualified
  method: join_fields
  fields:
  - subject_domain_name
  - subject_user_name
  separator: \
- name: identity_rdp_qualified
  method: join_fields
  fields:
  - identity_rdp_domain
  - identity_rdp_user
  separator: \
- name: identity_target_sid_valid
  method: regex_first
  from: win_target_sid
  pattern: (?i)^(S-1-(?!0-0$)\d+(?:-\d+)+)$
  group: 1
- name: identity_reporting_sid
  method: select_coalesce

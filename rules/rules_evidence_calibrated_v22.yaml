        artifact_change:
          conditions:
            any:
            - all:
              - artifact_path
              - unit_extension
              - timestamp_kind
          path_contains:
          - /etc/systemd/system/
          - /lib/systemd/system/
          - /usr/lib/systemd/system/
          - /etc/init.d/
          - /system/currentcontrolset/services/
          extension_in:
          - .service
          - .socket
          - .timer
          - .mount
          - .path
          timestamp_kinds:
          - create
          - modify
          - delete
          description: Systemd unit artefact changed under a service manager path
          confidence: high
          evidence:
          - path
          - timestamp_desc
          - hostname
        command_activity:
          conditions:
            any:
            - all:
              - persistent_token
            - all:
              - transient_token
              - unit_reference_extension
            - all:
              - transient_token
              - unit_reference_path
          persistent_tokens:
          - systemctl enable
          - systemctl link
          - systemctl preset
          - daemon-reload
          transient_tokens:
          - systemctl start
          - systemctl restart
          unit_reference_extensions:
          - .service
          - .socket
          - .timer
          - .mount
          - .path
          unit_reference_path_tokens:
          - /etc/systemd/
          - /lib/systemd/system/
          - /usr/lib/systemd/system/
          - /run/systemd/system/

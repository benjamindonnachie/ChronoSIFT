            all:
            - image_extension
            any: []
            none:
            - image_content_type
          - id: executable_extension_image_content_type
            all:
            - executable_extension
            - image_content_type
            any: []
            none: []
        double_extension_minimum_dots: 2
        indicators:
          file_upload: file_upload
          executable_upload: executable_upload
          double_extension_upload: double_extension_upload
          mime_extension_mismatch: upload_mime_extension_mismatch
      outcomes:
        upload:
          unknown: unknown
          accepted: accepted
          redirected: redirected
          rejected: rejected
        success_status:
          minimum: 200
          maximum_exclusive: 300
        redirect_status:
          minimum: 300
          maximum_exclusive: 400
        web:
          observed: observed
          attempt: attempt
          probable_success: probable_success
          selection:
            strategy: maximum_rank
            ranks:
              observed: 0
              attempt: 1
              probable_success: 2
          attempt_when:

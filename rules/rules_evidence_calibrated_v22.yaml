- id: LINUX_PRELOAD_CONTROL_CHANGE
  description: System-wide dynamic-loader preload control created or modified; high-priority hijacking candidate even without
    AV, contents and malicious use not established (ATT&CK T1574.006)
  priority: 91
  scope:
    any: []
    all:
    - field: parser
      op: regex
      value: ^filestat$
  when:
    any: []
    all:
    - field: filename
      op: eq
      value: /etc/ld.so.preload
    - field: file_entry_type
      op: eq
      value: file
    - field: timestamp_desc
      op: regex
      value: (?i)^(?:Creation|Content Modification|Modification|Metadata Modification) Time$
  emit:
    signals:
    - name: linux_preload_control_change
      value: 1
    evidence:
    - field: filename
    - field: timestamp_desc
    - field: owner_identifier
    - field: mode
    - field: sha256_hash
  confidence: medium
temporal_rules:
- id: WINDOWS_ACCOUNT_NEW_SOURCE
  description: Source absent from available seven-day successful-logon history for this SID; initial history may be incomplete
  priority: 120
  key_by:
  - win_context_sid
  lookback: 7d
  lookback_lower_bound: inclusive
  emit_on: condition_match
  minimum_signal_value_exclusive: 0
  condition:
    kind: first_seen_value
    field: win_login_ip
    empty_value_behavior: ignore
    first_observation_behavior: emit
    reference_selection: rolling_window
  emit:
    signals:
    - name: windows_account_new_source
      value: 1
  confidence: low
- id: WINDOWS_RECENT_NEW_SOURCE_ACTION
  description: Action by same SID/profile after a newly observed successful-logon source; not proof same live session or operator
    (ATT&CK T1078)
  priority: 107
  key_by:
  - win_context_sid
  lookback: 6h
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  include_supporting_rows: true
  sequence:
  - signal: windows_account_new_source
    min_count: 1
  - signal: windows_contextual_action
    min_count: 1
  emit:
    signals:
    - name: windows_recent_new_source_action
      value: 1
  confidence: medium
- id: WINDOWS_CREATED_THEN_PRIVILEGED
  description: Account creation then privileged membership for same SID (ATT&CK T1136/T1098.007)
  priority: 110
  key_by:
  - win_context_sid
  lookback: 1h
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  include_supporting_rows: true
  sequence:
  - signal: account_created
    min_count: 1
  - signal: privileged_account_created
    min_count: 1
  emit:
    signals:
    - name: windows_new_privileged_account
      value: 1
  confidence: medium
- id: WINDOWS_RECENT_PRIVILEGED_ACTION
  description: Action has recent privileged-account context by SID or unambiguous profile owner; not necessarily same operator/session
    (ATT&CK T1078)
  priority: 108
  key_by:
  - win_context_sid
  lookback: 7d
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  include_supporting_rows: true
  sequence:
  - signal: windows_new_privileged_account
    min_count: 1
  - signal: windows_contextual_action
    min_count: 1
  emit:
    signals:
    - name: windows_recent_privileged_action
      value: 1
  confidence: medium
- id: WINDOWS_RECENT_PRIVILEGED_HOST_ACTION
  description: Same-image security/archive/task action follows recent privileged-account creation; no direct actor attribution
    (ATT&CK T1685/T1560/T1053.005)
  priority: 108
  key_by:
  - win_asset_id
  lookback: 7d
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  include_supporting_rows: true
  sequence:
  - signal: windows_new_privileged_account
    min_count: 1
  - signal: windows_host_contextual_action
    min_count: 1
  emit:
    signals:
    - name: windows_recent_privileged_host_action
      value: 0.5
  confidence: medium
- id: WINDOWS_ARCHIVE_FTP
  description: Archive creation then FTP activity for same account/profile; possible staged transfer, upload unproved (ATT&CK
    T1074/T1560/T1048.003)
  priority: 105
  key_by:
  - win_context_sid
  lookback: 3d
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0

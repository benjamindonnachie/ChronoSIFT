    pattern: ^ssh$
- name: linux_account_target
  method: coalesce
  fields:
  - linux_account_created_name
  - linux_account_changed_name
  - linux_auth_account
  overwrite_existing: true
- name: linux_account_scope
  method: regex_first
  from: continuity_scope
  pattern: ^(.+)$
  group: 1
  selector:
    field: parser
    pattern: ^(?:text/syslog_traditional|syslog|systemd_journal)$
- name: linux_account_key
  method: join_fields
  fields:
  - linux_account_scope
  - linux_account_target
  separator: '|'
- name: linux_suid_bit
  method: bitmask_any
  from: mode
  mask: 2048
  number_format: strict_integer
- name: linux_executable_bit
  method: bitmask_any
  from: mode
  mask: 73
  number_format: strict_integer
- name: evidence_execution_actor
  method: select_coalesce
  cases:
  - field: linux_sudo_detail
    pattern: .+
    fields:
    - linux_sudo_allowed_runas
  default_fields:
  - actor_principal
  - actor_user
- name: linux_sudo_account_key
  method: join_fields
  fields:
  - linux_account_scope
  - linux_sudo_actor
  separator: '|'
- name: linux_behaviour_account_key
  method: coalesce
  fields:
  - linux_sudo_account_key
  - linux_account_key
  overwrite_existing: true
- name: ftp_log_text
  method: coalesce
  fields:
  - text
  - message
  overwrite_existing: true

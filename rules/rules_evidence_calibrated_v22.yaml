        sqli_attempt:
          name: web_sqli_attempt
          value: 1
          rule_id: WEB_SQLI_ATTEMPT
          description: Decoded web request contains high-confidence SQL injection syntax
          confidence: medium
        sqli_response_anomaly:
          name: web_sqli_response_anomaly
          value: 1
          rule_id: WEB_SQLI_RESPONSE_ANOMALY
          description: Successful SQLi-shaped request returned substantially more content than the endpoint baseline
          confidence: medium
        sqli_probable_success:
          name: web_sqli_probable_success
          value: 1
          rule_id: WEB_SQLI_PROBABLE_SUCCESS
          description: SQL injection syntax plus a successful anomalous response indicates probable exploitation
          confidence: medium
        public_facing_exploit:
          name: exploit_public_facing_app
          value: 1
          rule_id: EXPLOIT_PUBLIC_FACING_APP
          description: Qualified web evidence indicates public-facing application exploitation
          confidence: medium
      sqli:
        baseline:
          key_fields:
          - host
          - method
          - endpoint
          require_nonempty_keys:
          - endpoint
          scope: partition
          lookback: unbounded
          sample:
            indicators: absent
            response: successful
            bytes: nonnegative
          statistic: median
          minimum_samples: 2
          threshold_combine: maximum
          threshold_terms:
          - response_minimum
          - baseline_ratio
          - baseline_delta
          threshold_comparison: greater_than_or_equal
          response_ratio: 1.5
          response_delta_bytes: 2048
          response_minimum_bytes: 4096
          absolute_large_response_bytes: 65536
        decisions:
          attempt:
            all:
            - indicators
            any: []
            none: []
          response_anomaly:
            all:
            - indicators
            - successful_response
            - response_bytes
            - threshold_exceeded
            any: []
            none: []
          probable_success:
            all:
            - indicators
            - successful_response
            - response_bytes
            - threshold_exceeded
            any: []
            none: []
        emissions:
          attempt: sqli_attempt

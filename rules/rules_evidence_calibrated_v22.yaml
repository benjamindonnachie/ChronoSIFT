profiling:
  hour_of_week:
    enabled: true
    smoothing_alpha: 1
    quiet_quantile: 0.1
    min_profile_events: 100
    parser_field: parser
    filename_field: filename
    nsrl_is_os_component_field: nsrl_is_os_component
    nsrl_application_type_field: nsrl_application_type
    nsrl_exclusion_combine: any_available
    include_parser_regex: (?:mft|usnjrnl|filestat)
    insufficient_filtered_events: empty_profile
    exclude_nsrl_application_type_contains:
    - Operating System
    exclude_parser_contains:
    - apt_history
    - dpkg
    exclude_filename_contains:
    - WinSxS
    - SoftwareDistribution
    hour_of_week_field: hour_of_week
    activity_deficit_signal: out_of_hours_activity_deficit
    quiet_signal: quiet_time_event
    activity_deficit_score_field: chronosift_activity_deficit_score
    emit_activity_deficit_signal: false
    emit_quiet_time_signal: false
    activity_deficit_signal_merge: maximum
    quiet_signal_value: 1
    quiet_signal_merge: maximum
    activity_deficit_explanation:
      rule_id: OUT_OF_HOURS_ACTIVITY_DEFICIT
      description: Dataset-relative out-of-hours activity deficit contributed to score
      confidence: low
      evidence_type: profiling
      evidence:
      - score_column
      - activity_deficit_column
    quiet_explanation:
      rule_id: QUIET_TIME_EVENT
      description: Event occurred during a configured quiet profile hour
      confidence: low
      evidence_type: profiling
      evidence:
      - hour_of_week
      - quiet_quantile
    validation:
      method: leave_one_calendar_week_out_log_score
      reference: uniform_hour_of_week
      block: complete_calendar_week
      minimum_complete_weeks: 3
      confidence_level: 0.95
      bootstrap_resamples: 2000
      random_seed: 0
      acceptance: bootstrap_lower_bound_above_zero
      uncertainty_band: simultaneous_bootstrap_upper_probability
      amplification_gate: require_positive_activity_deficit
    score_amplifier:
      enabled: true
      method: one_plus_conservative_relative_activity_deficit
      scope: post_trust_event_score
      on_invalid_profile: neutral
      explanation:
        rule_id: OUT_OF_HOURS_AMPLIFIER
        description: Validated out-of-hours activity deficit amplified the event score
        confidence: medium
        evidence_type: profiling
        evidence:
        - hour_of_week
        - activity_probability
        - upper_probability_bound
        - reference_probability
        - activity_deficit
        - multiplier
        - validation_lower_bound
        - complete_week_count

              - local_file_inclusion
              - remote_file_inclusion
              - command_injection
              - webshell_command_parameter
            description: Decoded web request contains qualified public-facing exploitation syntax
            confidence: medium
            evidence:
            - http_method
            - http_path
            - canonical_endpoint
            - http_response_code
            - attack_indicators
            - actor_ip
            - http_request_user_agent
          configured_hint:

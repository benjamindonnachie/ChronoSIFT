      message_regex: (?i)\b(?:sshd|using authentication method:\s*[A-Za-z0-9_-]+\s+ssh)\b
      match: any
    escaped_control_regex: (?i)(?:\\r|\\n|\\t)+
    outputs:
      actor_user_auth: ssh_actor_user_auth
      actor_user_session: ssh_actor_user_session
      auth_method: ssh_auth_method
      source_ip: src_ip
      destination_ip: dst_ip
      protocol: auth_protocol
      direction: auth_direction
      outcome: auth_outcome
      session_id: session_id
      logon_id: logon_id

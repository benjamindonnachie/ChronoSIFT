          - input: timestamp_kind
            op: equals_any
            values:
            - delete
          - input: path_lower
            op: regex
            pattern: (?i)/(?:var/lib/(?:mysql|mariadb|postgresql)|mysql/data)/.+\.(?:ibd|frm|myd|myi|db)$

          rule_id: WINDOWS_PRIVILEGED_ACTIVITY_CONTEXT
          description: 'Bounded privileged-account context counted once: direct/profile SID versus weaker same-asset impairment
            context'
          confidence: medium
      evidence:
        derived_from:
          resolver: matched_signals
    windows_archive_ftp_projection:
      stage: temporal
      executor: signal_projection
      enabled: true
      evidence_type: contextual
      projections:
      - inputs:
          signals:
          - windows_archive_ftp_context
          - windows_archive_ftp_host_context
        conditions:
          match: any
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: windows_archive_ftp_evidence
          value: 1
          rule_id: WINDOWS_ARCHIVE_FTP_EVIDENCE
          description: Possible staged FTP transfer counted once, stronger same-account/profile link or weaker same-image
            association; completion not required
          confidence: medium
      evidence:
        derived_from:
          resolver: matched_signals
    web_content_followon:
      emissions:
      - name: web_content_change_after_shell
        value: 1
        rule_id: WEB_CONTENT_CHANGE_AFTER_SHELL
        description: Web content modification follows a file-linked suspicious request on the same asset; possible defacement,
          not verified authorship or content (ATT&CK T1491 candidate)
        confidence: low
      emit_on: target
      enabled: true
      evidence:
        artifact_timestamp:
          resolver: source_timestamp
        file_identity:
          field: evidence_web_identity
          resolver: target_field
        hostname:
          field: hostname
          resolver: target_field
        request_timestamp:
          resolver: target_timestamp
      evidence_type: contextual
      executor: signal_sequence
      key:
        scope: field
        field: evidence_asset
      lookback: 30m
      ordering: source_at_or_before_target
      source:
        any_signals:
        - evidence_linked_suspicious_request
        minimum_signal_value_exclusive: 0
      source_selection: earliest_in_window
      stage: temporal
      target:
        any_signals:
        - web_content_modification
        minimum_signal_value_exclusive: 0
      window_bounds: closed
    windows_malware_use_projection:
      stage: temporal
      executor: signal_projection
      enabled: true
      evidence_type: contextual
      projections:
      - inputs:
          signals:
          - windows_malware_execution_candidate
          - windows_qualified_malware_use
          - windows_malware_execution
          - windows_qualified_exact_malware_use
        conditions:
          match: any
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: windows_malware_use_priority
          value: 1
          rule_id: WINDOWS_MALWARE_USE_PRIORITY
          description: Qualified malware-use evidence counted once across AV/YARA routes; executed hash and path candidate
            remain distinct
          confidence: medium
      evidence:
        derived_from:
          resolver: matched_signals
    windows_creator_risk_projection:
      stage: temporal
      executor: signal_projection
      enabled: true
      evidence_type: contextual
      projections:
      - inputs:
          signals:
          - windows_created_by_risky_travel_account
          - windows_risky_creator_travel_privileged_account
          - windows_risky_creator_travel_action
          - windows_created_by_risky_authentication_account
          - windows_risky_creator_authentication_privileged_account
          - windows_risky_creator_authentication_action
        conditions:
          match: any
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: windows_risky_creator_context
          value: 1
          rule_id: WINDOWS_RISKY_CREATOR_CONTEXT
          description: Bounded creator-risk contribution counted once across authentication evidence; additive to new privilege,
            not a copied parent score
          confidence: medium
      evidence:
        derived_from:
          resolver: matched_signals
    linux_qualified_tool_invocation:
      stage: contextual
      executor: qualified_artifact_command
      enabled: true
      fields:
        path: filename
        parser: parser
        type: file_entry_type
        scope: hostname
        command: linux_cron_command
        row_id: chronosift_row_id
        hash: sha256_hash
      file_parser: ^filestat$
      file_type: ^file$
      marker_pattern: (?P<root>/.+)/\.git/HEAD
      references:
        absolute_script: \s*(?:nohup\s+)?(?:/usr/bin/|/bin/)?(?:python[0-9.]*|bash|sh|perl|ruby)\s+(?P<target>/[A-Za-z0-9_./+-]+\.(?:py|sh|pl|rb))(?:\s*&)?\s*
        working_directory: \s*cd\s+(?P<directory>/[A-Za-z0-9_./+-]+)\s*&&\s*(?:nohup\s+)?(?:/usr/bin/|/bin/)?(?:python[0-9.]*|bash|sh|perl|ruby)\s+(?P<target>[A-Za-z0-9_./+-]+\.(?:py|sh|pl|rb))(?:\s*&)?\s*
        prefix_directory_hint: \s*(?P<directory>/[A-Za-z0-9_./+-]+)/nohup\s+(?:/usr/bin/|/bin/)?(?:python[0-9.]*|bash|sh|perl|ruby)\s+(?P<target>[A-Za-z0-9_./+-]+\.(?:py|sh|pl|rb))(?:\s*&)?\s*
      source_signals:
      - qualified_tool_file
      - evidence_qualified_malware_file
      target_signals:
      - scheduled_exec
      lookback: 24h
      unlabelled_file_scope: current_dataset
      emissions:
        exact_path:
          name: linux_qualified_file_invocation
          value: 1
          rule_id: LINUX_QUALIFIED_FILE_INVOCATION
          confidence: medium
          description: Scheduled command references an earlier qualified full-path file candidate; file version and successful
            payload effects unproved (ATT&CK T1053.003, T1059)
        repository:
          name: linux_qualified_repository_invocation
          value: 1
          rule_id: LINUX_QUALIFIED_REPOSITORY_INVOCATION
          confidence: low
          description: Scheduled command references an observed component of a marker-verified repository containing an earlier
            qualified tool file; not an exact target-file YARA hit or proof of successful execution (ATT&CK T1053.003, T1059)
    linux_qualified_schedule_priority:
      stage: temporal
      executor: signal_projection
      enabled: true
      evidence_type: contextual
      projections:
      - inputs:
          signals:
          - scheduled_exec
          - linux_qualified_file_invocation
        conditions:
          match: all
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: linux_qualified_file_schedule_context
          value: 1
          rule_id: LINUX_QUALIFIED_FILE_SCHEDULE_CONTEXT
          description: Schedule invokes an evidence-qualified payload; exact-file versus weaker repository attribution remains
            in the source explanation, effects unproved (ATT&CK T1053.003)
          confidence: medium
      - inputs:
          signals:
          - privileged_scheduled_exec
          - linux_qualified_file_invocation
        conditions:
          match: all
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: linux_qualified_file_schedule_privilege
          value: 1
          rule_id: LINUX_QUALIFIED_FILE_SCHEDULE_PRIVILEGE
          description: Privileged schedule invokes an evidence-qualified payload; exact-file versus weaker repository attribution
            remains in the source explanation, effects unproved (ATT&CK T1053.003)
          confidence: medium
      - inputs:
          signals:
          - repeated_scheduled_exec
          - linux_qualified_file_invocation
        conditions:
          match: all
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: linux_qualified_file_schedule_repetition
          value: 1
          rule_id: LINUX_QUALIFIED_FILE_SCHEDULE_REPETITION
          description: Repeated schedule invokes an evidence-qualified payload; exact-file versus weaker repository attribution
            remains in the source explanation, effects unproved (ATT&CK T1053.003)
          confidence: medium
      - inputs:
          signals:
          - scheduled_exec
          - linux_qualified_repository_invocation
        conditions:
          match: all
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: linux_qualified_repository_schedule_context
          value: 1
          rule_id: LINUX_QUALIFIED_REPOSITORY_SCHEDULE_CONTEXT
          description: Schedule invokes an evidence-qualified payload; exact-file versus weaker repository attribution remains
            in the source explanation, effects unproved (ATT&CK T1053.003)
          confidence: medium
      - inputs:
          signals:
          - privileged_scheduled_exec
          - linux_qualified_repository_invocation
        conditions:
          match: all
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: linux_qualified_repository_schedule_privilege
          value: 1
          rule_id: LINUX_QUALIFIED_REPOSITORY_SCHEDULE_PRIVILEGE
          description: Privileged schedule invokes an evidence-qualified payload; exact-file versus weaker repository attribution
            remains in the source explanation, effects unproved (ATT&CK T1053.003)
          confidence: medium
      - inputs:
          signals:
          - repeated_scheduled_exec
          - linux_qualified_repository_invocation
        conditions:
          match: all
          minimum_value_exclusive: 0
        strength: maximum_matched_times_emission_value
        emissions:
        - name: linux_qualified_repository_schedule_repetition
          value: 1
          rule_id: LINUX_QUALIFIED_REPOSITORY_SCHEDULE_REPETITION
          description: Repeated schedule invokes an evidence-qualified payload; exact-file versus weaker repository attribution
            remains in the source explanation, effects unproved (ATT&CK T1053.003)
          confidence: medium
      evidence:
        derived_from:
          resolver: matched_signals
    category_qualified_webshell_artifact:
      stage: contextual
      executor: signal_gate
      enabled: true
      evidence_type: contextual
      inputs:
        signals:
        - web_script_artifact_candidate
        - av_webshell
        - yara_webshell
      conditions:
        match: all
        minimum_value_exclusive: 0
        groups:
        - match: all
          signals:
          - web_script_artifact_candidate
        - match: any
          signals:
          - av_webshell
          - yara_webshell
      emissions:
      - name: webshell_artifact
        value: 1
        rule_id: WEBSHELL_ARTIFACT
        description: Web-root executable script has direct AV/YARA web-shell category support; presence is not execution (ATT&CK
          T1505.003)
        confidence: medium
      evidence:
        derived_from:
          resolver: matched_signals
engine_notes:
  temporal_profiling: ChronoSift first attempts a host-resident hour-of-week profile, then falls back to the full dataset.
    The 100-event floor is retained. A profile must predict held-out complete calendar weeks better than a uniform 168-bin
    reference, with a positive deterministic whole-week-bootstrap lower bound. At least one simultaneous upper probability
    bound must also lie below the reference; otherwise full-dataset fallback continues. Accepted profiles derive deficit(h)
    = max(0, 1 - p_upper(h)/(1/168)) and a single bounded event-score factor 1 + deficit(h). The factor runs after trust dampening
    and before max_event_score. Failed or inconclusive validation is neutral. Optional out_of_hours_activity_deficit and quiet_time_event
    sparse emissions remain disabled and quiet membership does not gate amplification. Profiling uses UTC bins; the factor
    is evidence-volume-sensitive and intended for within-dataset prioritisation rather than direct cross-dataset comparison.
  geoip_metadata: When GeoLite2 City/ASN databases are provided, ChronoSift records input DB paths and file modification times
    in df.attrs['chronosift_metadata']['geoip'] for reproducibility.
  config_hygiene: ChronoSift lowercases signal keys during scoring to avoid case drift. Config validation checks (optional)
    help ensure weights and emitted signals remain aligned.
  profiling_nsrl_exclusion: For filesystem activity baselining, events whose nsrl_application_type contains 'Operating System'
    should be excluded from the hour-of-week baseline. This reduces routine operating-system churn in the profiling set and
    prevents OS artefacts from flattening the hour-of-week activity profile.
  profiling_package_exclusion: For filesystem activity baselining, package management and update-related activity should be
    excluded from the hour-of-week baseline. Specifically, parser names containing 'apt_history' or 'dpkg', and filenames
    containing 'WinSxS' or 'SoftwareDistribution', are excluded. This reduces routine maintenance bursts from flattening temporal
    activity contrast.
  yara_empty_list_handling: The YARA_HIT rule must key off yara_match_count > 0 rather than yara_match exists. This prevents
    empty list values ([]) from being treated as hits while preserving the raw yara_match field for analyst-facing evidence.
  message_context_hardening: Rules keyed on privileged-account names or transfer-tool names are restricted to structured actor
    or execution-history contexts where possible, to avoid false positives from file paths or file content.
  web_request_classification: detector_policy.detectors.web_request_classification is authoritative for raw web fields and
    sidecar aliases, parser tokens, bounded decoding and attack patterns, upload methods and outcomes, SQLi response inference,
    ordered direct-exploit branches, emissions, and explanation metadata. Python supplies bounded parsing, canonical request
    normalization, typed feature materialisation, endpoint baselines, and sparse execution mechanics.
  referenced_file_correlation: detector_policy.detectors.referenced_file_correlation is authoritative for filesystem and web-identity
    fields, document roots, propagation emissions, ordered web identity branches, and ordered web-evidence/ATT&CK mapping
    outputs and branches. It inherits normalized request fields, parser qualification, upload methods, and status semantics
    from the web classifier so each judgement has a single configuration owner. Python supplies canonical path/hash and sparse
    identity mechanics. Manifest schema v7 retains AV signature/family/category and strong YARA rule/category/score/quality
    metadata, records the ClamAV, YARA, correlation-policy, and source-input digests, and rebuilds automatically on a schema
    or digest mismatch. Weak YARA never enters web or hash indexes. URL/basename aliases shared by multiple hit-bearing filesystem
    paths are omitted, and a resolved exact upload hash takes precedence over weaker basename identity.
  webshell_artifact: detector_policy.detectors.webshell_artifact is authoritative for the contextual phase-27 web-shell artefact
    judgement. YAML owns its best-effort path and combined-text fields, web-root and script-extension references, basename/text/signal
    support, exclusive threshold, emission, evidence, confidence, and enablement. It runs after referenced-file correlation
    so configured AV/YARA propagation outputs are available. Python supplies path coalescing and normalization, basename/extension
    extraction, literal predicate evaluation, and sparse max-merge mechanics.
  yara_strength: detector_policy.detectors.yara_classification is authoritative for YARA metadata loading, ordered category
    classification, contributing categories, distinct-rule saturation, score scaling, confidence, evidence, output names,
    and the referenced-file gate. The baseline saturates at three contributing rules, excludes certificate-only matches from
    strength, and applies a configured 0.6..1 score multiplier.
  referenced_file_path_normalisation: The correlation policy selects fields and matching behaviour; Python normalises extracted
    paths, trims shell punctuation, and recognises relative execution forms such as ./tool and ../tool. Exact-path matching
    is used by default, with basename fallback only for explicitly relative paths. Empty document-root lists disable URL aliases;
    empty parser-token or upload-method lists independently disable those routes in the web classifier.
  web_sqli_inference: SQL injection syntax is evaluated after bounded URL decoding. A probable-success signal additionally
    requires a 2xx response whose byte count is anomalously large against successful non-SQLi responses for the same host,
    HTTP method, and canonical endpoint. Large responses without SQLi syntax do not imply successful exploitation; redirects
    and error responses remain attempts only.
  web_upload_execution_chain: detector_policy.detectors.web_upload_execution_chain is an independent signal_sequence. Its
    web-shell source, execution targets, target path/text context, dead-box scope, ordering, lookback, emission, and evidence
    are YAML-owned; it does not require webshell_activity to be enabled.
  ip_scope_continuity: When geolocation is unavailable because activity originates from private address space, the engine
    falls back to actor-IP continuity analysis and emits user_changed_private_ip, user_crossed_private_subnet, user_private_to_public_ip,
    and user_public_to_private_ip.
  profile_amplifier_scope: A validated activity-deficit factor is applied once to the complete post-trust event score. It
    does not mutate or repeatedly amplify individual signal values.
  account_change_linux_scope: ACCOUNT_CHANGE_LINUX is restricted to execution/history contexts (text/syslog_traditional, shell
    history, cron) to reduce benign metadata noise.
engine_config:
  config_validation:
    enabled: true
    strict: false
    notes: If enabled, ChronoSift validates that emitted signal names have corresponding weights and optionally warns on unused
      weights. Set strict=true to raise an error instead of warnings.
  schema_aliases:
    event_identifier:
    - event_id
    - eventid
    actor_user:
    - user_name
    - account_name
    - target_username
    actor_principal:
    - actor_user
    - username
    - user
    - target_user_name
    ip_address:
    - source_ip
    - src_ip
    - client_ip
    - remote_ip
    - ip
    src_ip:
    - ip_address
    - source_ip
    - client_ip
    - remote_ip
    - ip
    - actor_ip_final
    dst_ip:
    - destination_ip
    - dest_ip
    - server_ip
    - target_ip
    destination_ip:
    - dst_ip
    - dest_ip
    - server_ip
    - target_ip
    destination_fqdn:
    - dest_fqdn
    - target_fqdn
    - fqdn
    - server_name
    - dns_name
    destination_hostname:
    - dest_hostname
    - target_hostname
    - hostname
    - host_name
    - computer_name
    - workstation_name
    provider_name:
    - provider
    event_channel:
    - channel
    group_name:
    - group
    - groupname
    member_name:
    - member
    - membername
    share_name:
    - sharename
    share_local_path:
    - sharelocalpath
    relative_target_name:
    - relativetargetname
    - relativepathname
    logon_id:
    - target_logon_id
    - logonid
    - logon_guid
    session_id:
    - sessionid
    http_request_body:
    - request_body
    - request_body_text
    - post_data
    - form_data
    - http_post_data
    http_content_disposition:
    - content_disposition
    - multipart_content_disposition
    - part_content_disposition
    http_upload_filename:
    - upload_filename
    - multipart_filename
    - part_filename
    - file_name
    http_upload_content_type:
    - upload_content_type
    - multipart_content_type
    - part_content_type
    - mime_type
    http_upload_sha256:
    - upload_sha256
    - body_sha256
    - request_body_sha256
    - part_sha256
    http_request_content_length:
    - request_content_length
    - content_length
    - body_size
    - request_body_bytes
  temporal_signal_policy:
    ineligible_signals:
    - referenced_file_yara_hit
    - referenced_file_av_hit
    - referenced_file_luhn_hit
    - user_changed_private_ip
    - user_crossed_private_subnet
    - user_private_to_public_ip
    - user_public_to_private_ip
  trust_dampening:
    enabled: false
    multiplier: 0.5
    selector_match: any
    reason_precedence:
    - principal_literal
    - principal_regex
    - ip
    - asn
    inputs:
      principal_field: actor_principal
      ip_field: ip_address
      asn_field: geo_asn
    signals:
    - impossible_travel
    - fail_then_success_user
    - fail_then_success_ip
    - auth_pivot_accounts_from_same_src
    - auth_pivot_destinations_for_same_user
    - boundary_crossing
    - new_country
    - new_asn
    - cross_border_transfer
    trusted_actor_principals: []
    trusted_actor_principal_regex: []
    trusted_ips: []
    trusted_asns: []
    explanation:
      rule_id: TRUST_DAMPENING
      description: Trusted principal or infrastructure dampened selected behavioural signals
      confidence: medium
      evidence_type: contextual
      evidence:
      - reason
      - multiplier
      - signals

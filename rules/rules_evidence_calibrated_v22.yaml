rule_signal_merge:
  atomic_rules: maximum
  temporal_rules: maximum
rules:
- id: CRON_EXEC_LINUX
  description: Cron or scheduled command execution observed
  priority: 78
  scope:
    any: []
    all:
    - field: parser
      op: in_ci
      value:
      - systemd_journal
      - syslog
      - text/syslog_traditional
  when:
    any: []
    all:
    - field: message
      op: contains_ci
      value: cron
    - field: message
      op: contains
      value: CMD (
  emit:
    signals:
    - name: scheduled_exec
      value: 1
    evidence:
    - field: message
    - field: parser
    - field: actor_user
  confidence: medium
- id: INTERPRETER_EXEC_LINUX
  description: Linux interpreter invocation syntax observed; a cron CMD wrapper alone is not interpreter evidence
  priority: 76
  scope:
    any: []
    all:
    - field: parser
      op: in_ci
      value:
      - systemd_journal
      - syslog
      - text/bash_history
      - bash_history
      - zsh_extended_history
      - cron
      - text/syslog_traditional
  when:
    any:
    - field: actor_cmd
      op: contains_ci
      value: python
    - field: command_line
      op: contains_ci
      value: python
    - field: actor_cmd
      op: contains_ci
      value: perl
    - field: command_line
      op: contains_ci
      value: perl
    - field: actor_cmd
      op: contains_ci
      value: php
    - field: command_line
      op: contains_ci
      value: php
    - field: actor_cmd
      op: contains_ci
      value: ruby
    - field: command_line
      op: contains_ci
      value: ruby
    - field: actor_cmd
      op: contains_ci
      value: bash
    - field: command_line
      op: contains_ci
      value: bash
    - field: actor_cmd
      op: regex
      value: (?i)(?:^|[^A-Za-z0-9_./:-])sh(?:$|[^A-Za-z0-9_./:-])
    - field: command_line
      op: regex
      value: (?i)(?:^|[^A-Za-z0-9_./:-])sh(?:$|[^A-Za-z0-9_./:-])
    - field: linux_cron_command
      op: regex
      value: (?i)(?:^|&&\s*)\s*(?:(?:/[^\s"';&|]+/)?nohup\s+)?["']?(?:/[^\s"';&|]+/)?(?:python(?:[0-9.]+)?|perl|php[0-9.]*|ruby|bash|dash|ksh|zsh|sh)["']?(?:\s|$)
    all: []
  emit:
    signals:
    - name: interpreter_exec_linux
      value: 1
    evidence:
    - field: actor_cmd
    - field: command_line
    - field: message
    - field: parser
    - field: linux_cron_command
  confidence: medium
- id: PRIVILEGED_SCHEDULED_EXEC
  description: Scheduled execution under privileged account
  priority: 82
  scope:
    any: []
    all:
    - field: parser
      op: in_ci
      value:
      - systemd_journal
      - syslog
      - text/syslog_traditional
  when:
    any:
    - field: actor_user
      op: in_ci
      value:
      - root
      - administrator
      - admin
    - field: message
      op: contains_ci
      value: (root)
    - field: message
      op: contains_ci
      value: (administrator)
    - field: message
      op: contains_ci
      value: (admin)
    all:
    - field: message
      op: contains_ci
      value: cron
    - field: message
      op: contains
      value: CMD (
  emit:
    signals:
    - name: privileged_scheduled_exec
      value: 1
    evidence:
    - field: actor_user
    - field: message
    - field: parser
  confidence: medium
- id: AUTH_FAIL_GENERIC
  description: Authentication failure indicated by message keywords (fallback)
  priority: 80
  scope:
    any:
    - field: auth_outcome
      op: eq
      value: failure
    - field: message
      op: regex
      value: (?i)(?:sshd|pam_|authentication|logon failure|failed (?:password|publickey)|invalid user)
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: failed
    - field: message
      op: contains_ci
      value: failure
    - field: message
      op: contains_ci
      value: invalid password
    - field: message
      op: contains_ci
      value: failed publickey
    - field: message
      op: contains_ci
      value: authentication failed
    - field: message
      op: contains_ci
      value: logon failure
    - field: message
      op: contains_ci
      value: invalid user
    all: []
  emit:
    signals:
    - name: auth_fail_generic
      value: 1
    evidence:
    - field: message
    - field: parser
    - field: timestamp_desc
    - field: event_identifier
  confidence: medium
- id: AUTH_SUCCESS_GENERIC
  description: Authentication success indicated by message keywords (fallback)
  priority: 80
  scope:
    any: []
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: accepted password
    - field: message
      op: contains_ci
      value: accepted publickey
    - field: message
      op: contains_ci
      value: accepted keyboard-interactive/pam
    - field: message
      op: contains_ci
      value: authentication succeeded
    - field: message
      op: contains_ci
      value: logged in
    - field: message
      op: contains_ci
      value: logon success
    - field: message
      op: contains_ci
      value: session opened
    all: []
  emit:
    signals:
    - name: auth_success_generic
      value: 1
    evidence:
    - field: message
    - field: parser
    - field: timestamp_desc
    - field: event_identifier
  confidence: medium
- id: SSH_SUCCESS_LINUX
  description: SSH authentication or session establishment succeeded
  priority: 88
  scope:
    any:
    - field: parser
      op: in_ci
      value:
      - systemd_journal
      - syslog
      - text/syslog_traditional
    - field: message
      op: contains_ci
      value: sshd
    - field: auth_protocol
      op: eq
      value: ssh
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: accepted password
    - field: message
      op: contains_ci
      value: accepted publickey
    - field: message
      op: contains_ci
      value: accepted keyboard-interactive/pam
    - field: message
      op: contains_ci
      value: session opened for user
    - field: auth_protocol
      op: eq
      value: ssh
    all:
    - field: auth_outcome
      op: eq
      value: success
  emit:
    signals:
    - name: ssh_success
      value: 1
    evidence:
    - field: actor_user
    - field: actor_ip
    - field: actor_auth_method
    - field: message
    - field: parser
  confidence: high
- id: SSH_FAIL_LINUX
  description: SSH authentication failed or invalid user attempted
  priority: 88
  scope:
    any:
    - field: parser
      op: in_ci
      value:
      - systemd_journal
      - syslog
      - text/syslog_traditional
    - field: message
      op: contains_ci
      value: sshd
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: failed password
    - field: message
      op: contains_ci
      value: failed publickey
    - field: message
      op: contains_ci
      value: invalid user
    all: []
  emit:
    signals:
    - name: ssh_fail
      value: 1
    evidence:
    - field: actor_user
    - field: actor_ip
    - field: actor_auth_method
    - field: message
    - field: parser
  confidence: high
- id: RDP_SUCCESS_WINDOWS_4624
  description: Windows remote interactive logon succeeded (Security 4624 LogonType 10)
  priority: 92
  scope:
    any: []
    all:
    - field: parser
      op: contains_ci
      value: winevt
  when:
    any: []
    all:
    - field: event_identifier

    web_request_classification:
      stage: atomic
      executor: web_request_classifier
      enabled: true
      evidence_type: contextual
      inputs:
        parser: parser
        message: message
        request: http_request
        url: url
        headers: http_headers
        response_code: http_response_code
        response_bytes: http_response_bytes
        source_ip_fields:
        - actor_ip
        - src_ip
        - ip_address

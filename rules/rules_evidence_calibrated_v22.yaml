        upload_filename: http_upload_filename
        upload_content_type: http_upload_content_type
        upload_sha256: http_upload_sha256
        request_content_length: http_request_content_length
      outputs:
        upload_names: chronosift_web_upload_names
        upload_hashes: chronosift_web_upload_hashes
        upload_outcome: chronosift_web_upload_outcome
        web_outcome: chronosift_web_outcome
        attack_indicators: chronosift_web_attack_indicators
        source_ip: chronosift_web_source_ip
        method: chronosift_web_method
        endpoint: chronosift_web_endpoint
        status: chronosift_web_status_code
      matching:
        web_log_parser_tokens:
        - apache
        - nginx
        - iis
        - w3c
        - msiis
        allowed_url_schemes:
        - http
        - https
      indicators:
        decode_rounds: 2
        sqli:
          prefix: 'sqli:'
          patterns:
          - name: union_select
            regex: (?i)\bunion\s+(?:all\s+)?select\b
          - name: schema_enumeration
            regex: (?i)\binformation_schema\b|\b(?:table|column)_name\b
          - name: database_function
            regex: (?i)\b(?:database|version|current_user|user)\s*\(
          - name: file_access
            regex: (?i)\b(?:load_file|into\s+(?:out|dump)file)\b
          - name: time_delay
            regex: (?i)\b(?:sleep|benchmark|pg_sleep)\s*\(|\bwaitfor\s+delay\b
          - name: error_based
            regex: (?i)\b(?:extractvalue|updatexml)\s*\(
          - name: stacked_query
            regex: (?i);\s*(?:select|insert|update|delete|drop|alter|create)\b
          - name: boolean_tautology
            regex: (?i)(?:['"`)]\s*(?:or|and)\s+[^\s&]{0,64}?=|\b(?:or|and)\s+\(?\s*\d+\s*=\s*(?:\d+\b|[\w.]*\()|\b(?:or|and)\s+['"`]\s*[^\s&'"`]*\s*['"`]?\s*=\s*['"`])
          - name: ordered_probe
            regex: (?i)\border\s+by\s+\d+\s*(?:--|#|/\*)
          - name: inline_subquery
            regex: (?i)(?:^|[?&])[^=&]*=\s*\(\s*select\b
        path_traversal:
          indicator: path_traversal
          decoded_contains:
          - ../
          - ..\
          raw_contains:
          - '%2e%2e'
          - '%252e'
        local_file_inclusion:
          indicator: local_file_inclusion
          decoded_contains:
          - /etc/passwd
          - /etc/shadow
          - proc/self/environ
          - php://filter
          - file://
          - boot.ini
          - win.ini
        remote_file_inclusion:
          indicator: remote_file_inclusion
          regex_any:
          - (?i)(?:^|[?&])\s*(?:page|file|path|template|include|inc|doc|document|lang|module|dir|root|conf|config|load|read|show|pg)\s*=\s*https?://
          - (?i)(?:^|[?&])[^=&]+\s*=\s*https?://[^\s&]+\.(?:php|phtml|php[345]|asp|aspx|ashx|jsp|jspx|cgi|pl|py|rb|sh|txt)\b
        command_injection:
          indicator: command_injection
          regex: (?i)(?:&&|\|\||\$\(|`|;|\|)\s*/?(?:[\w.-]+/)*(?:sh|bash|dash|zsh|cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh|whoami|id|uname|cat|type|curl|wget|nc|netcat)\b(?!\s*=)
        injection_probe:
          indicator: injection_probe
          breakout_regex: '[''"`]\s*[<>"''`]|[<>]\s*[''"`]'
          metacharacter_regex: '[''"`()<>]'
          quote_regex: '[''"`]'
          minimum_metacharacters: 4
          minimum_distinct_metacharacters: 2
        webshell_command_parameter:
          indicator: webshell_command_parameter
          regex: (?i)(?:^|[?&])(?:cmd|exec|command|shell)=
      upload:
        methods:
        - POST
        - PUT
        - PATCH
        query_parameter_names:
        - filename
        - file
        - name
        - path
        - upload
        - uploadfile
        - qqfile
        - dest
        - destination
        filename_extension_admission: nonempty_suffix
        endpoint_tokens:
        - upload
        - filemanager
        - connector
        - ajaxfilemanager
        - ckfinder
        - elfinder
        nameless_methods:
        - PUT
        multipart_content_type: multipart/form-data
        executable_extensions:
        - .php
        - .phtml
        - .php3
        - .php4
        - .php5
        - .asp
        - .aspx
        - .ashx
        - .jsp
        - .jspx
        - .cgi
        - .pl
        image_extensions:
        - .jpg

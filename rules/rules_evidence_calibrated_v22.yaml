    - name: rdp_fail
      value: 1
    - name: auth_fail_generic
      value: 1
    evidence:
    - field: event_identifier
    - field: logon_type
    - field: actor_user
    - field: rdp_client_address
    - field: workstation_name
    - field: provider_name
  confidence: high
- id: RDP_PRE_AUTH_WINDOWS_1149
  description: Terminal Services authentication succeeded before full session establishment (1149)
  priority: 84

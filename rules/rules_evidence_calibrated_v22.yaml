      protocol: ssh
      direction: remote
      success_outcome: success
      failure_outcome: failure
    patterns:
    - id: plaso_successful_login
      regex: (?i)\bSuccessful login of user:\s*([A-Za-z0-9._$@-]+)\s+from\s+([0-9.]+):[0-9]+\s+using authentication method:\s*([A-Za-z0-9_-]+)\s+ssh\b
      outcome: success
      groups:
        actor_user_auth: 1
        source_ip: 2
        auth_method: 3
      require_message_selector: false
    - id: accepted
      regex: (?i)\baccepted\s+([a-z0-9_-]+(?:/[a-z0-9_-]+)?)\s+for\s+([A-Za-z0-9._$@-]+)\s+from\s+([0-9A-Fa-f:.]+)
      outcome: success
      groups:
        auth_method: 1
        actor_user_auth: 2
        source_ip: 3
      require_message_selector: false
    - id: failed
      regex: (?i)\bfailed\s+([a-z0-9_-]+(?:/[a-z0-9_-]+)?)\s+for(?:\s+invalid\s+user)?\s+([A-Za-z0-9._$@-]+)\s+from\s+([0-9A-Fa-f:.]+)
      outcome: failure
      groups:
        auth_method: 1
        actor_user_auth: 2
        source_ip: 3
      require_message_selector: false
    - id: invalid_user
      regex: (?i)\binvalid user\s+([A-Za-z0-9._$@-]+)\s+from\s+([0-9A-Fa-f:.]+)
      outcome: failure
      groups:
        actor_user_auth: 1
        source_ip: 2
      require_message_selector: false
    - id: session_opened
      regex: (?i)\bsession opened for user\s+([A-Za-z0-9._$@-]+)\b
      outcome: success
      groups:
        actor_user_session: 1
      require_message_selector: true

- id: PRIV_LOGIN
  description: Privileged account authenticated successfully; a targeted account name alone is not access
  priority: 90
  scope:
    any:
    - field: auth_outcome
      op: eq
      value: success
    - field: message
      op: regex
      value: (?i)(?:successful login|accepted (?:password|publickey)|session opened for user)
    all: []
  when:
    any:
    - field: actor_user
      op: in_ci
      value: &id001
      - root
      - administrator
      - admin
    all: []
  emit:
    signals:
    - name: privileged_login
      value: 1
    evidence:
    - field: actor_user
    - field: message
  confidence: medium
- id: UA_OFFENSIVE
  description: User-Agent in a web-server log suggests scanning/probing tooling
  priority: 70

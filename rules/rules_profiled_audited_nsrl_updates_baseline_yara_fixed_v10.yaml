    yara_classification:
      stage: atomic
      executor: yara_classifier
      enabled: true
      evidence_type: direct
      metadata:
        # The corpus is intentionally not redistributed. This repository-relative
        # default may be replaced for a run with --yara-metadata-path.
        path: rules/yara-forge-rules-extended.yar
        on_missing: name_only
        on_parse_error: name_only
        defaults:
          score: 75
          quality: 70
        unindexed_rule:
          classification: name_only
          score: 0
          quality: 0
      classification:
        mode: first_match
        default_category: malware
        ordered_rules:
        - id: tc_ransomware
          category: ransomware
          all:
          - field: tc_detection_type
            op: equals_any
            values: [ransomware]
        - id: tc_malware
          category: malware
          all:
          - field: tc_detection_type
            op: equals_any
            values: [backdoor, trojan, rat, infostealer, pua]
        - id: tc_exploit
          category: exploit
          all:
          - field: tc_detection_type
            op: equals_any
            values: [exploit, rootkit]
        - id: ransomware_tag
          category: ransomware
          all:
          - field: tags
            op: contains_any
            values: [ransomware]
        - id: informational_certificate_tag
          category: certificate
          all:
          - field: tags
            op: contains_any
            values: [info]
          - field: tags
            op: contains_none
            values: [malicious, malware]
          - field: rule_name
            op: contains_any
            values: [cert, blocklist]
        - id: informational_certificate_category
          category: certificate
          all:
          - field: category
            op: equals_any
            values: [info]
          - field: rule_name
            op: contains_any
            values: [cert, blocklist]
        - id: certificate_name
          category: certificate
          all:
          - field: rule_name
            op: regex
            pattern: 'Cert_Blocklist|INDICATOR_KB_CERT'
        - id: webshell_name
          category: webshell
          all:
          - field: rule_name
            op: regex
            pattern: 'Webshell|web_shell'
        - id: offensive_tool_name
          category: offensive_tool
          all:
          - field: rule_name
            op: regex
            pattern: 'Cobaltstrike|cobalt_strike|Mimikatz|Rubeus|HKTL_|Hacktool|INDICATOR_TOOL|SafetyKatz|SharpKatz|LaZagne|Impacket'
        - id: ransomware_name
          category: ransomware
          all:
          - field: rule_name
            op: regex
            pattern: 'Ransomware|Ransom_'
        - id: apt_name
          category: apt
          all:
          - field: rule_name
            op: regex
            pattern: '(?:^|_)APT(?:_|\d)|(?:^|_)Apt_'
        - id: exploit_name
          category: exploit
          all:
          - field: rule_name
            op: regex
            pattern: 'Exploit|Shellcode|CVE_\d|CVE\d|Rootkit|LOLDriver'
      strength:
        rule_count: distinct_rule_names
        saturation_count: 3
        score_multiplier:
          aggregate: maximum
          divisor: 100
          floor: 0.6
          ceiling: 1
        unnamed_matches:
          mode: raw_count
          multiplier: 0.6
        emission:
          name: yara_hit_strength
          value: 1
          rule_id: YARA_HIT_STRENGTH
          description: Category-aware YARA support excluding non-contributing categories and weighted by rule score
          confidence: low
        score_confidence:
          minimum_score: 75
          confidence: medium
        evidence:
        - yara_match_count
        - contributing_rule_count
        - strength
        - best_score
        - score_multiplier
        - rule_names
        max_rule_names: 10
      categories:
        offensive_tool:
          contributes_to_strength: true
          emission:
            name: yara_offensive_tool
            value: 1
            rule_id: YARA_OFFENSIVE_TOOL
            description: YARA Forge offensive tool detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
        ransomware:
          contributes_to_strength: true
          emission:
            name: yara_ransomware
            value: 1
            rule_id: YARA_RANSOMWARE
            description: YARA Forge ransomware detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
        webshell:
          contributes_to_strength: true
          emission:
            name: yara_webshell
            value: 1
            rule_id: YARA_WEBSHELL
            description: YARA Forge web shell detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
        apt:
          contributes_to_strength: true
          emission:
            name: yara_apt
            value: 1
            rule_id: YARA_APT
            description: YARA Forge APT detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
        exploit:
          contributes_to_strength: true
          emission:
            name: yara_exploit
            value: 1
            rule_id: YARA_EXPLOIT
            description: YARA Forge exploit or rootkit detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
        certificate:
          contributes_to_strength: false
          emission:
            name: yara_certificate_blocklist
            value: 1
            rule_id: YARA_CERTIFICATE
            description: YARA Forge certificate blocklist detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
        malware:
          contributes_to_strength: true
          emission:
            name: yara_malware
            value: 1
            rule_id: YARA_MALWARE
            description: YARA Forge malware detection
            confidence: medium
          score_confidence: {minimum_score: 80, confidence: high}
          evidence: [category, rule_count, rule_names, best_score, best_quality]
          max_rule_names: 5
      referenced_file_gate:
        minimum_score: 75
        minimum_quality: 70
        categories:
        - offensive_tool
        - ransomware
        - webshell
        - apt
        - exploit
        - malware
        allow_unnamed: false
    web_request_classification:
      stage: atomic
      executor: web_request_classifier
      enabled: true
      evidence_type: contextual
      inputs:
        parser: parser
        message: message
        request: http_request
        url: url
        headers: http_headers
        response_code: http_response_code
        response_bytes: http_response_bytes
        source_ip_fields: [actor_ip, src_ip, ip_address]
        user_agent: http_request_user_agent
        referer: http_request_referer
        body: http_request_body
        content_disposition: http_content_disposition
        upload_filename: http_upload_filename
        upload_content_type: http_upload_content_type
        upload_sha256: http_upload_sha256
        request_content_length: http_request_content_length
      outputs:
        upload_names: chronosift_web_upload_names
        upload_hashes: chronosift_web_upload_hashes
        upload_outcome: chronosift_web_upload_outcome
        web_outcome: chronosift_web_outcome
        attack_indicators: chronosift_web_attack_indicators
        source_ip: chronosift_web_source_ip
        method: chronosift_web_method
        endpoint: chronosift_web_endpoint
        status: chronosift_web_status_code
      matching:
        web_log_parser_tokens: [apache, nginx, iis, w3c, msiis]
      indicators:
        decode_rounds: 2
        sqli:
          prefix: 'sqli:'
          patterns:
          - name: union_select
            regex: >-
              (?i)\bunion\s+(?:all\s+)?select\b
          - name: schema_enumeration
            regex: >-
              (?i)\binformation_schema\b|\b(?:table|column)_name\b
          - name: database_function
            regex: >-
              (?i)\b(?:database|version|current_user|user)\s*\(
          - name: file_access
            regex: >-
              (?i)\b(?:load_file|into\s+(?:out|dump)file)\b
          - name: time_delay
            regex: >-
              (?i)\b(?:sleep|benchmark|pg_sleep)\s*\(|\bwaitfor\s+delay\b
          - name: error_based
            regex: >-
              (?i)\b(?:extractvalue|updatexml)\s*\(
          - name: stacked_query
            regex: >-
              (?i);\s*(?:select|insert|update|delete|drop|alter|create)\b
          - name: boolean_tautology
            regex: >-
              (?i)(?:['"`)]\s*(?:or|and)\s+[^\s&]{0,64}?=|\b(?:or|and)\s+\(?\s*\d+\s*=\s*(?:\d+\b|[\w.]*\()|\b(?:or|and)\s+['"`]\s*[^\s&'"`]*\s*['"`]?\s*=\s*['"`])
          - name: ordered_probe
            regex: >-
              (?i)\border\s+by\s+\d+\s*(?:--|#|/\*)
          - name: inline_subquery
            regex: >-
              (?i)(?:^|[?&])[^=&]*=\s*\(\s*select\b
        path_traversal:
          indicator: path_traversal
          decoded_contains: ['../', '..\']
          raw_contains: ['%2e%2e', '%252e']
        local_file_inclusion:
          indicator: local_file_inclusion
          decoded_contains:
          - /etc/passwd
          - /etc/shadow
          - proc/self/environ
          - php://filter
          - file://
          - boot.ini
          - win.ini
        remote_file_inclusion:
          indicator: remote_file_inclusion
          regex_any:
          - >-
            (?i)(?:^|[?&])\s*(?:page|file|path|template|include|inc|doc|document|lang|module|dir|root|conf|config|load|read|show|pg)\s*=\s*https?://
          - >-
            (?i)(?:^|[?&])[^=&]+\s*=\s*https?://[^\s&]+\.(?:php|phtml|php[345]|asp|aspx|ashx|jsp|jspx|cgi|pl|py|rb|sh|txt)\b
        command_injection:
          indicator: command_injection
          regex: >-
            (?i)(?:&&|\|\||\$\(|`|;|\|)\s*/?(?:[\w.-]+/)*(?:sh|bash|dash|zsh|cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh|whoami|id|uname|cat|type|curl|wget|nc|netcat)\b(?!\s*=)
        injection_probe:
          indicator: injection_probe
          breakout_regex: >-
            ['"`]\s*[<>"'`]|[<>]\s*['"`]
          metacharacter_regex: >-
            ['"`()<>]
          quote_regex: >-
            ['"`]
          minimum_metacharacters: 4
          minimum_distinct_metacharacters: 2
        webshell_command_parameter:
          indicator: webshell_command_parameter
          regex: >-
            (?i)(?:^|[?&])(?:cmd|exec|command|shell)=
      upload:
        methods: [POST, PUT, PATCH]
        query_parameter_names: [filename, file, name, path, upload, uploadfile, qqfile, dest, destination]
        filename_extension_admission: nonempty_suffix
        endpoint_tokens: [upload, filemanager, connector, ajaxfilemanager, ckfinder, elfinder]
        nameless_methods: [PUT]
        multipart_content_type: multipart/form-data
        executable_extensions: [.php, .phtml, .php3, .php4, .php5, .asp, .aspx, .ashx, .jsp, .jspx, .cgi, .pl]
        image_extensions: [.jpg, .jpeg, .png, .gif, .webp, .svg]
        image_content_type_prefix: image/
        mime_value_pairing: exactly_one
        mime_mismatch:
          match: any
          branches:
          - id: image_extension_non_image_content_type
            all: [image_extension]
            any: []
            none: [image_content_type]
          - id: executable_extension_image_content_type
            all: [executable_extension, image_content_type]
            any: []
            none: []
        double_extension_minimum_dots: 2
        indicators:
          file_upload: file_upload
          executable_upload: executable_upload
          double_extension_upload: double_extension_upload
          mime_extension_mismatch: upload_mime_extension_mismatch
      outcomes:
        upload:
          unknown: unknown
          accepted: accepted
          redirected: redirected
          rejected: rejected
        success_status: {minimum: 200, maximum_exclusive: 300}
        redirect_status: {minimum: 300, maximum_exclusive: 400}
        web:
          observed: observed
          attempt: attempt
          probable_success: probable_success
          selection:
            strategy: maximum_rank
            ranks:
              observed: 0
              attempt: 1
              probable_success: 2
          attempt_when:
            indicators_any:
            - path_traversal
            - local_file_inclusion
            - remote_file_inclusion
            - command_injection
            - injection_probe
            - webshell_command_parameter
            - file_upload
            - executable_upload
            - double_extension_upload
            - upload_mime_extension_mismatch
            indicator_prefixes_any: ['sqli:']
      emissions:
        sqli_attempt:
          name: web_sqli_attempt
          value: 1
          rule_id: WEB_SQLI_ATTEMPT
          description: Decoded web request contains high-confidence SQL injection syntax
          confidence: medium
        sqli_response_anomaly:
          name: web_sqli_response_anomaly
          value: 1
          rule_id: WEB_SQLI_RESPONSE_ANOMALY
          description: Successful SQLi-shaped request returned substantially more content than the endpoint baseline
          confidence: medium
        sqli_probable_success:
          name: web_sqli_probable_success
          value: 1
          rule_id: WEB_SQLI_PROBABLE_SUCCESS
          description: SQL injection syntax plus a successful anomalous response indicates probable exploitation
          confidence: medium
        public_facing_exploit:
          name: exploit_public_facing_app
          value: 1
          rule_id: EXPLOIT_PUBLIC_FACING_APP
          description: Qualified web evidence indicates public-facing application exploitation
          confidence: medium
      sqli:
        baseline:
          key_fields: [host, method, endpoint]
          require_nonempty_keys: [endpoint]
          scope: partition
          lookback: unbounded
          sample:
            indicators: absent
            response: successful
            bytes: nonnegative
          statistic: median
          minimum_samples: 2
          threshold_combine: maximum
          threshold_terms: [response_minimum, baseline_ratio, baseline_delta]
          threshold_comparison: greater_than_or_equal
          response_ratio: 1.5
          response_delta_bytes: 2048
          response_minimum_bytes: 4096
          absolute_large_response_bytes: 65536
        decisions:
          attempt: {all: [indicators], any: [], none: []}
          response_anomaly: {all: [indicators, successful_response, response_bytes, threshold_exceeded], any: [], none: []}
          probable_success: {all: [indicators, successful_response, response_bytes, threshold_exceeded], any: [], none: []}
        emissions:
          attempt: sqli_attempt
          response_anomaly: sqli_response_anomaly
          probable_success: sqli_probable_success
        evidence:
        - http_method
        - http_path
        - canonical_endpoint
        - sqli_indicators
        - http_response_code
        - http_response_bytes
        - baseline_response_statistic
        - baseline_statistic
        - baseline_sample_count
        - response_anomaly_threshold
        - actor_ip
        - http_request_user_agent
      exploit:
        emission: public_facing_exploit
        branches:
          executable_upload:
            conditions:
              indicators_all: [file_upload, executable_upload]
            description: Web request has upload semantics and targets an executable web script
            confidence: high
            evidence: [http_method, http_path, canonical_endpoint, http_response_code, attack_indicators, upload_name, upload_names, upload_outcome]
          exploit_syntax:
            conditions:
              indicators_any: [path_traversal, local_file_inclusion, remote_file_inclusion, command_injection, webshell_command_parameter]
            description: Decoded web request contains qualified public-facing exploitation syntax
            confidence: medium
            evidence: [http_method, http_path, canonical_endpoint, http_response_code, attack_indicators, actor_ip, http_request_user_agent]
          configured_hint:
            conditions:
              signals_any: [web_exploitation_hint, web_sqli_probable_success]
              minimum_signal_value_exclusive: 0
            description: Configured web evidence suggests public-facing exploitation
            confidence: low
            evidence: [http_method, http_path, canonical_endpoint, http_response_code, attack_indicators, actor_ip]

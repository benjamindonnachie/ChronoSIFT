        - archive_created
        - large_archive_created
        minimum_signal_value_exclusive: 0
        allow_unlabelled: true
      follow_on_qualification:
        any:
        - all: [copy_command, copy_text_support]
        - all: [copy_command, copy_signal_support]
        - all: [follow_on_signal]
      emissions:
      - name: password_store_exfil_chain
        value: 1
        rule_id: PASSWORD_STORE_EXFIL_CHAIN
        description: Password-store access was followed by copy, archive, or transfer activity within a bounded window
        confidence: medium
      evidence:
        hostname: {resolver: row_field, field: hostname}
        source_timestamp: {resolver: source_timestamp}
        window_seconds: {resolver: window_seconds}
    webshell_activity:
      stage: temporal
      executor: signal_sequence
      enabled: true
      evidence_type: contextual
      lookback: 30m
      ordering: source_at_or_before_target
      window_bounds: closed
      source_selection: earliest_in_window
      emit_on: target
      key:
        scope: deadbox_global
      source:
        any_signals:
        - webshell_artifact
        minimum_signal_value_exclusive: 0
      target:
        any_signals:
        - web_exploitation_hint
        - exploit_public_facing_app
        minimum_signal_value_exclusive: 0
      emissions:
      - name: webshell_activity
        value: 1
        rule_id: WEBSHELL_ACTIVITY
        description: Web-shell-like file artefact and suspicious web request activity co-occurred within a bounded window
        confidence: high
      evidence:
        hostname:
          resolver: target_field
          field: hostname
        artifact_timestamp:
          resolver: source_timestamp
        request_timestamp:
          resolver: target_timestamp
    web_upload_execution_chain:
      stage: temporal
      executor: signal_sequence
      enabled: true
      evidence_type: contextual
      lookback: 30m
      ordering: source_at_or_before_target
      window_bounds: closed
      source_selection: earliest_in_window
      emit_on: target
      key:
        scope: deadbox_global
      source:
        any_signals:
        - webshell_artifact
        minimum_signal_value_exclusive: 0
      target:
        any_signals:
        - prefetch_execution
        - amcache_execution
        - suspicious_execution
        - execution_lolbin
        - execution_interpreter
        minimum_signal_value_exclusive: 0
        where:
          match: any
          path:
            resolver: best_effort_file_path
            fields: [filename, relative_path, display_name, pathspec, link_target]
            contains_any: [/var/www/, /srv/www/, /usr/share/nginx/html/, /htdocs/, /httpdocs/, '/inetpub/wwwroot/', '/xampp/htdocs/']
          combined_text:
            resolver: concat_lower
            fields: [message, command_line, filename, relative_path, display_name, pathspec, link_target]
            contains_any:
            - /var/www/
            - /srv/www/
            - inetpub
            - wwwroot
            - .php
            - .aspx
            - .jsp
            - .jspx
            - .ashx
      emissions:
      - name: web_upload_execution_chain
        value: 1
        rule_id: WEB_UPLOAD_EXECUTION_CHAIN
        description: Web-root script artefact was followed by suspicious execution within a bounded window
        confidence: medium
      evidence:
        hostname:
          resolver: target_field
          field: hostname
        artifact_timestamp:
          resolver: source_timestamp
        execution_timestamp:
          resolver: target_timestamp
engine_notes:
  temporal_profiling: 'ChronoSift derives dataset-wide hour-of-week rarity from host-resident events (excluding web access
    telemetry). The shipped policy uses that dense profile only for configured multipliers. Optional hour_rarity (0..1,
    surprisal with smoothing) and quiet_time_event emissions can be enabled explicitly; when enabled they enter the ordinary
    signal map before scoring with their configured value, merge, and explanation policies.'
  geoip_metadata: When GeoLite2 City/ASN databases are provided, ChronoSift records input DB paths and file modification times
    in df.attrs['chronosift_metadata']['geoip'] for reproducibility.
  config_hygiene: ChronoSift lowercases signal keys during scoring to avoid case drift. Config validation checks (optional)
    help ensure weights and emitted signals remain aligned.
  profiling_nsrl_exclusion: For filesystem activity baselining, events whose nsrl_application_type contains 'Operating System'
    should be excluded from the hour-of-week baseline. This reduces routine operating-system churn in the profiling set and
    prevents OS artefacts from flattening temporal rarity.
  profiling_package_exclusion: For filesystem activity baselining, package management and update-related activity should be
    excluded from the hour-of-week baseline. Specifically, parser names containing 'apt_history' or 'dpkg', and filenames
    containing 'WinSxS' or 'SoftwareDistribution', are excluded. This reduces routine maintenance bursts from flattening temporal
    rarity.
  yara_empty_list_handling: The YARA_HIT rule must key off yara_match_count > 0 rather than yara_match exists. This prevents
    empty list values ([]) from being treated as hits while preserving the raw yara_match field for analyst-facing evidence.
  message_context_hardening: Rules keyed on privileged-account names or transfer-tool names are restricted to structured actor
    or execution-history contexts where possible, to avoid false positives from file paths or file content.
  web_request_classification: detector_policy.detectors.web_request_classification is authoritative for raw web fields and
    sidecar aliases, parser tokens, bounded decoding and attack patterns, upload methods and outcomes, SQLi response inference,
    ordered direct-exploit branches, emissions, and explanation metadata. Python supplies bounded parsing, canonical request
    normalization, typed feature materialisation, endpoint baselines, and sparse execution mechanics.
  referenced_file_correlation: detector_policy.detectors.referenced_file_correlation is authoritative for filesystem and web-identity
    fields, document roots, propagation emissions, ordered web identity branches, and ordered web-evidence/ATT&CK mapping outputs
    and branches. It inherits normalized request fields, parser qualification, upload methods, and status semantics from the web
    classifier so each judgement has a single configuration owner. Python supplies canonical path/hash and sparse identity mechanics.
    Manifest schema v7 retains AV signature/family/category and strong YARA rule/category/score/quality metadata, records the
    ClamAV, YARA, correlation-policy, and source-input digests, and rebuilds automatically on a schema or digest mismatch. Weak
    YARA never enters web or hash indexes. URL/basename aliases shared by multiple hit-bearing filesystem paths are omitted,
    and a resolved exact upload hash takes precedence over weaker basename identity.
  webshell_artifact: detector_policy.detectors.webshell_artifact is authoritative for the contextual phase-27 web-shell artefact
    judgement. YAML owns its best-effort path and combined-text fields, web-root and script-extension references,
    basename/text/signal support, exclusive threshold, emission, evidence, confidence, and enablement. It runs after
    referenced-file correlation so configured AV/YARA propagation outputs are available. Python supplies path coalescing and
    normalization, basename/extension extraction, literal predicate evaluation, and sparse max-merge mechanics.
  yara_strength: 'detector_policy.detectors.yara_classification is authoritative for YARA metadata loading, ordered category
    classification, contributing categories, distinct-rule saturation, score scaling, confidence, evidence, output names,
    and the referenced-file gate. The baseline saturates at three contributing rules, excludes certificate-only matches from
    strength, and applies a configured 0.6..1 score multiplier.'
  referenced_file_path_normalisation: The correlation policy selects fields and matching behaviour; Python normalises extracted
    paths, trims shell punctuation, and recognises relative execution forms such as ./tool and ../tool. Exact-path matching is
    used by default, with basename fallback only for explicitly relative paths. Empty document-root lists disable URL aliases;
    empty parser-token or upload-method lists independently disable those routes in the web classifier.
  web_sqli_inference: SQL injection syntax is evaluated after bounded URL decoding. A probable-success signal additionally
    requires a 2xx response whose byte count is anomalously large against successful non-SQLi responses for the same host,
    HTTP method, and canonical endpoint. Large responses without SQLi syntax do not imply successful exploitation; redirects and error responses remain
    attempts only.
  web_upload_execution_chain: detector_policy.detectors.web_upload_execution_chain is an independent signal_sequence. Its
    web-shell source, execution targets, target path/text context, dead-box scope, ordering, lookback, emission, and evidence are
    YAML-owned; it does not require webshell_activity to be enabled.
  ip_scope_continuity: When geolocation is unavailable because activity originates from private address space, the engine
    falls back to actor-IP continuity analysis and emits user_changed_private_ip, user_crossed_private_subnet, user_private_to_public_ip,
    and user_public_to_private_ip.
  profile_multiplier_dedup: Profile multipliers are applied at most once per signal per event, and explanation entries are
    deduplicated.
  account_change_linux_scope: ACCOUNT_CHANGE_LINUX is restricted to execution/history contexts (text/syslog_traditional, shell
    history, cron) to reduce benign metadata noise.
engine_config:
  config_validation:
    enabled: true
    strict: false
    notes: If enabled, ChronoSift validates that emitted signal names have corresponding weights and optionally warns on unused
      weights. Set strict=true to raise an error instead of warnings.
  schema_aliases:
    event_identifier: [event_id, eventid]
    actor_user: [user_name, account_name, target_username]
    actor_principal: [actor_user, username, user, target_user_name]
    ip_address: [source_ip, src_ip, client_ip, remote_ip, ip]
    src_ip: [ip_address, source_ip, client_ip, remote_ip, ip, actor_ip_final]
    dst_ip: [destination_ip, dest_ip, server_ip, target_ip]
    destination_ip: [dst_ip, dest_ip, server_ip, target_ip]
    destination_fqdn: [dest_fqdn, target_fqdn, fqdn, server_name, dns_name]
    destination_hostname: [dest_hostname, target_hostname, hostname, host_name, computer_name, workstation_name]
    provider_name: [provider]
    event_channel: [channel]
    group_name: [group, groupname]
    member_name: [member, membername]
    share_name: [sharename]
    share_local_path: [sharelocalpath]
    relative_target_name: [relativetargetname, relativepathname]
    logon_id: [target_logon_id, logonid, logon_guid]
    session_id: [sessionid]
    http_request_body: [request_body, request_body_text, post_data, form_data, http_post_data]
    http_content_disposition: [content_disposition, multipart_content_disposition, part_content_disposition]
    http_upload_filename: [upload_filename, multipart_filename, part_filename, file_name]
    http_upload_content_type: [upload_content_type, multipart_content_type, part_content_type, mime_type]
    http_upload_sha256: [upload_sha256, body_sha256, request_body_sha256, part_sha256]
    http_request_content_length: [request_content_length, content_length, body_size, request_body_bytes]
  temporal_signal_policy:
    ineligible_signals:
    - referenced_file_yara_hit
    - referenced_file_av_hit
    - referenced_file_luhn_hit
    - impossible_travel
    - user_changed_private_ip
    - user_crossed_private_subnet
    - user_private_to_public_ip
    - user_public_to_private_ip
  trust_dampening:
    enabled: false
    multiplier: 0.5
    selector_match: any
    reason_precedence: [principal_literal, principal_regex, ip, asn]
    inputs:
      principal_field: actor_principal
      ip_field: ip_address
      asn_field: geo_asn
    signals:
    - impossible_travel
    - fail_then_success_user
    - fail_then_success_ip
    - auth_pivot_accounts_from_same_src
    - auth_pivot_destinations_for_same_user
    - boundary_crossing
    - new_country
    - new_asn
    - cross_border_transfer
    trusted_actor_principals: []
    trusted_actor_principal_regex: []
    trusted_ips: []
    trusted_asns: []
    explanation:
      rule_id: TRUST_DAMPENING
      description: Trusted principal or infrastructure dampened selected behavioural signals
      confidence: medium
      evidence_type: contextual
      evidence: [reason, multiplier, signals]

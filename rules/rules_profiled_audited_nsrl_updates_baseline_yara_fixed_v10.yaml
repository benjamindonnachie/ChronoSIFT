impossible_travel:
  enabled: true
  key_by:
  - actor_principal
  success_signal_keys:
  - auth_remote_success
  min_distance_km: 200
  min_time_seconds: 60
  velocity_kmh_threshold: 900
  notes: Impossible travel is computed on canonical principal continuity (actor_principal) across canonical authentication
    success events identified by success_signal_keys (matched case-insensitively in code). Thresholds are static for behavioural
    stability; profile-based tuning may be introduced later.
engine_notes:
  temporal_profiling: 'ChronoSift can inject context signals derived from a dataset-wide hour-of-week activity profile: hour_rarity
    (0..1, surprisal with smoothing) and quiet_time_event (0/1, bottom-quantile hours). These are computed from host-resident
    events (excluding web access telemetry) and are injected into chronosift_signals after rule evaluation and before scoring.
    No explicit DSL rules are required.'
  geoip_metadata: When GeoLite2 City/ASN databases are provided, ChronoSift records input DB paths and file modification times
    in df.attrs['chronosift_metadata']['geoip'] for reproducibility.
  config_hygiene: ChronoSift lowercases signal keys during scoring to avoid case drift. Config validation checks (optional)
    help ensure weights and emitted signals remain aligned.
  profiling_nsrl_exclusion: For filesystem activity baselining, events whose nsrl_application_type contains 'Operating System'
    should be excluded from the hour-of-week baseline. This reduces routine operating-system churn in the profiling set and
    prevents OS artefacts from flattening temporal rarity.
  profiling_package_exclusion: For filesystem activity baselining, package management and update-related activity should be
    excluded from the hour-of-week baseline. Specifically, parser names containing 'apt_history' or 'dpkg', and filenames
    containing 'WinSxS' or 'SoftwareDistribution', are excluded. This reduces routine maintenance bursts from flattening temporal
    rarity.
  yara_empty_list_handling: The YARA_HIT rule must key off yara_match_count > 0 rather than yara_match exists. This prevents
    empty list values ([]) from being treated as hits while preserving the raw yara_match field for analyst-facing evidence.
  message_context_hardening: Rules keyed on privileged-account names or transfer-tool names are restricted to structured actor
    or execution-history contexts where possible, to avoid false positives from file paths or file content.
  referenced_file_hit_propagation: The engine emits referenced_file_yara_hit, referenced_file_av_hit, and referenced_file_luhn_hit
    when a row references an exact file path that has direct YARA, AV, or Luhn hits elsewhere in the timeline. For web-server
    logs, configurable document roots add canonical URL-path aliases; successful Luhn-positive GET downloads and access or upload
    of AV/strong-YARA files receive direction-aware signals without a maximum time window. Manifest schema v4 retains AV
    signature/family/category and strong YARA rule/category/score/quality metadata for evidence-qualified downstream mapping,
    and adds SHA-256 hit/identity indexes for hash-based upload correlation. Older manifests are rebuilt automatically.
  yara_strength: 'Binary YARA_HIT is removed. The engine derives yara_hit_strength from yara_match_count using bounded linear
    scaling: min(1, yara_match_count / 3). One, two, and three-or-more matches therefore contribute one-third, two-thirds,
    and full YARA support respectively.'
  referenced_file_path_normalisation: Referenced-file correlation normalises extracted paths, trims shell punctuation, and
    recognises relative execution forms such as ./tool and ../tool. Exact-path matching is used by default, with basename
    fallback only for explicitly relative paths.
  web_sqli_inference: SQL injection syntax is evaluated after bounded URL decoding. A probable-success signal additionally
    requires a 2xx response whose byte count is anomalously large against successful non-SQLi responses for the same host,
    HTTP method, and canonical endpoint. Large responses without SQLi syntax do not imply successful exploitation; redirects and error responses remain
    attempts only.
  private_ip_continuity: When geolocation is unavailable because activity originates from private address space, the engine
    falls back to actor-IP continuity analysis and emits user_changed_private_ip, user_crossed_private_subnet, user_private_to_public_ip,
    and user_public_to_private_ip.
  profile_multiplier_dedup: Profile multipliers are applied at most once per signal per event, and explanation entries are
    deduplicated.
  account_change_linux_scope: ACCOUNT_CHANGE_LINUX is restricted to execution/history contexts (text/syslog_traditional, shell
    history, cron) to reduce benign metadata noise.
engine_config:
  # Path to YARA Forge .yar file for category-aware YARA signal scoring.
  # When set, the engine parses rule metadata to classify YARA matches into
  # forensic categories (offensive_tool, ransomware, webshell, apt, exploit,
  # certificate, malware) and applies differential weighting.
  # Download this file locally or override it with --yara-metadata-path. The
  # upstream YARA Forge rule corpus is intentionally not redistributed here.
  yara_forge_metadata_path: "rules/yara-forge-rules-extended.yar"

  canonical_auth_signals:
    success_target: auth_success
    fail_target: auth_failure
    success_sources:
    - auth_success_generic
    - ssh_success
    - rdp_success
    fail_sources:
    - auth_fail_generic
    - ssh_fail
    - rdp_fail
  config_validation:
    enabled: true
    strict: false
    notes: If enabled, ChronoSift validates that emitted signal names have corresponding weights and optionally warns on unused
      weights. Set strict=true to raise an error instead of warnings.
  schema_aliases:
    actor_principal:
    - actor_user
    - username
    - user
    - target_user_name
    src_ip:
    - ip_address
    - source_ip
    - client_ip
    - remote_ip
    - ip
    - actor_ip_final
    destination_ip:
    - dst_ip
    - dest_ip
    - server_ip
    - target_ip
  path_taxonomy:
    web_root_patterns:
    - /var/www/
    - /srv/www/
    - /usr/share/nginx/html/
    - /htdocs/
    - /httpdocs/
    - \inetpub\wwwroot\
    - \xampp\htdocs\
    sensitive_path_patterns:
    - /etc/passwd
    - /etc/shadow
    - /etc/sudoers
    - /root/.ssh/
    - /.ssh/
    - /.gnupg/
    - /.bash_history
    - /.zsh_history
    - /.mysql_history
    - /.psql_history
    - id_rsa
    - id_dsa
    - id_ecdsa
    - id_ed25519
    - authorized_keys
    - known_hosts
    - \windows\system32\config\sam
    - \windows\system32\config\system
    - \windows\system32\config\security
    - ntds.dit
    - web.config
    - \repair\sam
    - \repair\system
    database_dump_patterns:
    - dump
    - mysqldump
    - pg_dump
    - sqlite dump
    cron_path_patterns:
    - /etc/crontab
    - /etc/anacrontab
    - /etc/cron.d/
    - /etc/cron.daily/
    - /etc/cron.hourly/
    - /etc/cron.monthly/
    - /etc/cron.weekly/
    - /var/spool/cron/
    - /var/spool/cron/crontabs/
    service_config_patterns:
    - /etc/systemd/system/
    - /lib/systemd/system/
    - /usr/lib/systemd/system/
    - /etc/init.d/
    - \system\currentcontrolset\services\
    firewall_path_patterns:
    - /etc/firewalld/
    - /etc/ufw/
    - /etc/sysconfig/iptables
    - /etc/iptables/
    - \sharedaccess\parameters\firewallpolicy\
    group_policy_path_patterns:
    - \grouppolicy\
    - \sysvol\
    - \policies\
    - registry.pol
    winlogon_path_patterns:
    - \microsoft\windows nt\currentversion\winlogon
    com_hijack_path_patterns:
    - \classes\clsid\
    - \classes\wow6432node\clsid\
    os_update_path_patterns:
    - \winsxs\
    - \softwaredistribution\
    - \windows\assembly\
    - \windows\installer\
    - /usr/lib/
    - /usr/share/doc/
    - /usr/share/man/
    - /var/cache/apt/
    - /var/cache/dnf/
    - /var/cache/yum/
    - /var/lib/dpkg/
    - /var/lib/rpm/
  detection_vocabulary:
    archive_extensions:

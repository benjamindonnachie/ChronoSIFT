- id: LOLBIN_WINDOWS_SUSPICIOUS_ARGS
  description: Windows LOLBin with suspicious arguments (encoded/download/proxy exec)
  priority: 74
  scope:
    any: []
    all: []
  when:
    any:
    - field: actor_cmd
      op: regex
      value: (?i)\b(powershell|pwsh)\b.*\b(-enc|-encodedcommand|-e\s)\b
    - field: actor_cmd
      op: regex
      value: (?i)\b(powershell|pwsh)\b.*\b(iwr|invoke-webrequest|wget|curl|downloadstring|new-object\s+net\.webclient)\b

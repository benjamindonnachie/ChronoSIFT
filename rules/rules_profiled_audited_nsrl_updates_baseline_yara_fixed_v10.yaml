- id: PRIV_LOGIN
  description: Privileged account observed in structured actor context
  priority: 90
  scope:
    any: []
    all: []
  when:
    any:
    - field: actor_user
      op: in_ci
      value:
      - root
      - administrator
      - admin
    all: []
  emit:
    signals:
    - name: privileged_login
      value: 1
    evidence:
    - field: actor_user
    - field: message
  confidence: medium
- id: UA_OFFENSIVE
  description: User-Agent in a web-server log suggests scanning/probing tooling
  priority: 70
  scope:
    any:
    - field: parser
      op: regex
      value: (?i)(apache|nginx|iis|w3c|msiis)
    - field: sourcetype
      op: regex
      value: (?i)(apache|nginx|iis|w3c|msiis)
    all: []
  when:
    any:
    - field: actor_ua
      op: regex
      value: \b(nmap|nikto|sqlmap|skipfish|masscan|dirb|gobuster|wpscan|acunetix|nessus|openvas|kali)\b
    all: []
  emit:
    signals:
    - name: offensive_user_agent
      value: 1
    evidence:
    - field: actor_ua
    - field: message
    - field: url
  confidence: medium
- id: WEB_SUSPICIOUS_PATHS
  description: Suspicious web request path indicators (webshell/traversal/exec hints)
  priority: 75
  scope:
    any:
    - field: parser
      op: regex
      value: (?i)(apache|nginx|iis|w3c|msiis)
    - field: sourcetype
      op: regex
      value: (?i)(apache|nginx|iis|w3c|msiis)
    all: []
  when:
    any:
    - field: actor_url
      op: regex
      value: (?i)(/cmd\.php|/shell\.php|/webshell|/c99|/r57|\.php\?cmd=|\.php\?exec=|\.php\?shell=|\.{2}/|/etc/passwd)
    all: []
  emit:
    signals:
    - name: web_exploitation_hint
      value: 1
    evidence:
    - field: actor_url
    - field: message
    - field: http_response_code
  confidence: low

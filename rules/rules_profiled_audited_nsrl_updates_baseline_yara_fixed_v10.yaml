temporal_rules:
- id: FAIL_THEN_SUCCESS_USER
  description: Repeated remote authentication failures followed by remote success for same principal within lookback
  priority: 80
  key_by:
  - actor_principal
  lookback: 6h
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  sequence:
  - signal: auth_remote_failure
    min_count: 3
  - signal: auth_remote_success
    min_count: 1
  emit:
    signals:
    - name: fail_then_success_user
      value: 1
  confidence: medium
- id: FAIL_THEN_SUCCESS_IP
  description: Repeated remote authentication failures followed by remote success from same source IP within lookback
  priority: 80
  key_by:
  - src_ip
  lookback: 6h
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  sequence:
  - signal: auth_remote_failure
    min_count: 3
  - signal: auth_remote_success
    min_count: 1
  emit:
    signals:
    - name: fail_then_success_ip
      value: 1
  confidence: medium
- id: LOCAL_FAIL_THEN_SUCCESS_USER
  description: Local authentication failure followed by local success for same principal within lookback
  priority: 68
  key_by:
  - actor_principal
  lookback: 6h
  lookback_lower_bound: inclusive
  emit_on: sequence_completion
  minimum_signal_value_exclusive: 0
  sequence:
  - signal: auth_local_failure
    min_count: 1
  - signal: auth_local_success

profiling:
  hour_of_week:
    smoothing_alpha: 1
    neighbour_smooth: true
    quiet_threshold: 0.8
    emit_hour_rarity_signal: true
    emit_quiet_time_signal: true
profile_multipliers:
- id: QUIET_TIME_PRIV
  applies_to_signals:
  - privileged_login
  k: 0.5
- id: QUIET_TIME_BOUNDARY
  applies_to_signals:
  - boundary_crossing
  - new_country
  - new_asn
  - new_city
  k: 0.5
- id: QUIET_TIME_PERSIST
  applies_to_signals:
  - persistence_service
  - persistence_scheduled_task
  - persistence_runkey
  - account_or_group_change
  k: 0.75
- id: QUIET_TIME_LOLBIN
  applies_to_signals:
  - lolbin_linux
  - lolbin_windows
  - lolbin_suspicious_args
  k: 0.75
- id: QUIET_TIME_EXFIL
  applies_to_signals:
  - large_archive_created
  - staging_then_transfer
  - sensitive_data_staged
  - cross_border_transfer
  - archive_after_sensitive_access
  k: 0.75
normalisation:
- name: ssh_actor_user_auth
  from: message
  method: regex_first
  pattern: (?i)\b(?:accepted|failed)\s+\S+(?:\s+for(?:\s+invalid\s+user)?)\s+([A-Za-z0-9._$@-]+)\b
  group: 1
- name: ssh_actor_user_session
  from: message
  method: regex_first
  pattern: (?i)\bsession opened for user\s+([A-Za-z0-9._$@-]+)\b
  group: 1
- name: ssh_auth_method
  from: message
  method: regex_first
  pattern: (?i)\b(?:accepted|failed)\s+([a-z0-9_-]+(?:/[a-z0-9_-]+)?)\b
  group: 1
- name: actor_user
  method: coalesce
  fields:
  - actor_user
  - target_user_name
  - ssh_actor_user_auth
  - ssh_actor_user_session
  - user_name
  - account_name
  - target_username
  - username
  - user
  - fullname
  - subject_user_name
  - user_sid
  - account_rid
  - requester
  - reporter
- name: actor_principal
  method: coalesce
  fields:
  - actor_principal
  - actor_user
  - user_name
  - account_name
  - username
  - user
  - target_user_name
  - subject_user_name
  - user_sid
- name: src_ip
  method: coalesce
  fields:
  - src_ip
  - rdp_client_address
  - client_address
  - source_network_address
  - ip_address
  - source_ip
  - client_ip
  - remote_ip
  - ip
- name: dst_ip
  method: coalesce
  fields:
  - dst_ip
  - destination_ip
  - dest_ip
  - server_ip
  - target_ip
- name: destination_ip
  method: coalesce
  fields:
  - destination_ip
  - dst_ip
  - dest_ip
  - server_ip
  - target_ip
- name: destination_fqdn
  method: coalesce
  fields:
  - destination_fqdn
  - dest_fqdn
  - target_fqdn
  - fqdn
  - server_name
  - dns_name
- name: destination_hostname
  method: coalesce
  fields:
  - destination_hostname
  - dest_hostname
  - target_hostname
  - hostname
  - host_name
  - computer_name
  - workstation_name
- name: actor_ip
  method: coalesce
  fields:
  - src_ip
- name: actor_port
  method: coalesce
  fields:
  - port
- name: actor_proto
  method: coalesce
  fields:
  - protocol
- name: actor_ua
  method: coalesce
  fields:
  - http_request_user_agent
- name: actor_url
  method: coalesce
  fields:
  - url
  - http_request
  - http_request_referer
- name: actor_cmd
  method: coalesce
  fields:
  - command_line_arguments
  - command_line
  - command
- name: actor_auth_method
  method: coalesce
  fields:
  - ssh_auth_method
  - authentication_package
  - logon_process
  - authentication_method
- name: auth_protocol
  method: coalesce
  fields:
  - auth_protocol
- name: auth_direction
  method: coalesce
  fields:
  - auth_direction
- name: auth_outcome
  method: coalesce
  fields:
  - auth_outcome
- name: session_id
  method: coalesce
  fields:
  - session_id
  - rdp_session_name
- name: logon_id
  method: coalesce
  fields:
  - logon_id
- name: actor_exit_status
  method: coalesce
  fields:
  - exit_status
- name: ipv4_fallback
  from: message
  method: ipv4_first
- name: actor_ip_final
  method: coalesce
  fields:
  - actor_ip
  - ipv4_fallback
- name: file_ext
  from: filename
  method: file_extension
rules:
- id: CRON_EXEC_LINUX
  description: Cron or scheduled command execution observed
  priority: 78
  scope:
    any: []
    all:
      - field: parser
        op: in_ci
        value: [systemd_journal, syslog, text/syslog_traditional]
  when:
    any: []
    all:
      - field: message
        op: contains_ci
        value: cron
      - field: message
        op: contains
        value: 'CMD ('
  emit:
    signals:
      - name: scheduled_exec
        value: 1
    evidence:
      - field: message
      - field: parser
      - field: actor_user
  confidence: medium
- id: INTERPRETER_EXEC_LINUX
  description: Linux interpreter execution observed
  priority: 76
  scope:
    any: []
    all:
      - field: parser
        op: in_ci
        value: [systemd_journal, syslog, text/bash_history, bash_history, zsh_extended_history, cron, text/syslog_traditional]
  when:
    any:
      - field: actor_cmd
        op: contains_ci
        value: python
      - field: command_line
        op: contains_ci
        value: python
      - field: actor_cmd
        op: contains_ci
        value: perl
      - field: command_line
        op: contains_ci
        value: perl
      - field: actor_cmd
        op: contains_ci
        value: php
      - field: command_line
        op: contains_ci
        value: php
      - field: actor_cmd
        op: contains_ci
        value: ruby
      - field: command_line
        op: contains_ci
        value: ruby
      - field: actor_cmd
        op: contains_ci
        value: bash
      - field: command_line
        op: contains_ci
        value: bash
      - field: actor_cmd
        op: regex
        value: (?i)(?:^|[^A-Za-z0-9_./:-])sh(?:$|[^A-Za-z0-9_./:-])
      - field: command_line
        op: regex
        value: (?i)(?:^|[^A-Za-z0-9_./:-])sh(?:$|[^A-Za-z0-9_./:-])
      - field: message
        op: contains
        value: 'CMD ('
    all: []
  emit:
    signals:
      - name: interpreter_exec_linux
        value: 1
    evidence:
      - field: actor_cmd
      - field: command_line
      - field: message
      - field: parser
  confidence: medium
- id: PRIVILEGED_SCHEDULED_EXEC
  description: Scheduled execution under privileged account
  priority: 82
  scope:
    any: []
    all:
      - field: parser
        op: in_ci
        value: [systemd_journal, syslog, text/syslog_traditional]
  when:
    any:
      - field: actor_user
        op: in_ci
        value: [root, administrator, admin]
      - field: message
        op: contains_ci
        value: '(root)'
      - field: message
        op: contains_ci
        value: '(administrator)'
      - field: message
        op: contains_ci
        value: '(admin)'
    all:
      - field: message
        op: contains_ci
        value: cron
      - field: message
        op: contains
        value: 'CMD ('
  emit:
    signals:
      - name: privileged_scheduled_exec
        value: 1
    evidence:
      - field: actor_user
      - field: message
      - field: parser
  confidence: medium
- id: AUTH_FAIL_GENERIC
  description: Authentication failure indicated by message keywords (fallback)
  priority: 80
  scope:
    any: []
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: failed
    - field: message
      op: contains_ci
      value: failure
    - field: message
      op: contains_ci
      value: invalid password
    - field: message
      op: contains_ci
      value: failed publickey
    - field: message
      op: contains_ci
      value: authentication failed
    - field: message
      op: contains_ci
      value: logon failure
    - field: message
      op: contains_ci
      value: invalid user
    all: []
  emit:
    signals:
    - name: auth_fail_generic
      value: 1
    evidence:
    - field: message
    - field: parser
    - field: timestamp_desc
    - field: event_identifier
  confidence: medium
- id: AUTH_SUCCESS_GENERIC
  description: Authentication success indicated by message keywords (fallback)
  priority: 80
  scope:
    any: []
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: accepted password
    - field: message
      op: contains_ci
      value: accepted publickey
    - field: message
      op: contains_ci
      value: accepted keyboard-interactive/pam
    - field: message
      op: contains_ci
      value: authentication succeeded
    - field: message
      op: contains_ci
      value: logged in
    - field: message
      op: contains_ci
      value: logon success
    - field: message
      op: contains_ci
      value: session opened
    all: []
  emit:
    signals:
    - name: auth_success_generic
      value: 1
    evidence:
    - field: message
    - field: parser
    - field: timestamp_desc
    - field: event_identifier
  confidence: medium
- id: SSH_SUCCESS_LINUX
  description: SSH authentication or session establishment succeeded
  priority: 88
  scope:
    any:
    - field: parser
      op: in_ci
      value: [systemd_journal, syslog, text/syslog_traditional]
    - field: message
      op: contains_ci
      value: sshd
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: accepted password
    - field: message
      op: contains_ci
      value: accepted publickey
    - field: message
      op: contains_ci
      value: accepted keyboard-interactive/pam
    - field: message
      op: contains_ci
      value: session opened for user
    all: []
  emit:
    signals:
    - name: ssh_success
      value: 1
    evidence:
    - field: actor_user
    - field: actor_ip
    - field: actor_auth_method
    - field: message
    - field: parser
  confidence: high
- id: SSH_FAIL_LINUX
  description: SSH authentication failed or invalid user attempted
  priority: 88
  scope:
    any:
    - field: parser
      op: in_ci
      value: [systemd_journal, syslog, text/syslog_traditional]
    - field: message
      op: contains_ci
      value: sshd
    all: []
  when:
    any:
    - field: message
      op: contains_ci
      value: failed password
    - field: message
      op: contains_ci
      value: failed publickey
    - field: message
      op: contains_ci
      value: invalid user
    all: []
  emit:
    signals:
    - name: ssh_fail
      value: 1
    evidence:
    - field: actor_user
    - field: actor_ip
    - field: actor_auth_method
    - field: message
    - field: parser
  confidence: high
- id: RDP_SUCCESS_WINDOWS_4624
  description: Windows remote interactive logon succeeded (Security 4624 LogonType 10)
  priority: 92
  scope:
    any: []
    all:
    - field: parser
      op: contains_ci
      value: winevt
  when:
    any: []
    all:
    - field: event_identifier
      op: eq
      value: '4624'
    - field: logon_type
      op: eq
      value: '10'
  emit:
    signals:
    - name: rdp_success
      value: 1
    - name: auth_success_generic
      value: 1
    evidence:
    - field: event_identifier
    - field: logon_type
    - field: actor_user
    - field: rdp_client_address
    - field: workstation_name
    - field: provider_name
  confidence: high
- id: RDP_FAIL_WINDOWS_4625

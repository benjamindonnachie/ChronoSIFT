    execution_context_classifier:
      stage: atomic
      executor: execution_context_classifier
      enabled: true
      evidence_type: direct
      inputs:
        path:
          resolver: first_nonempty
          fields: [image_path, new_process_name, file_path, filename, relative_path, display_name, pathspec, path]
        command:
          resolver: first_nonempty
          fields: [actor_cmd, command_line, command, message]
        actor:
          resolver: first_nonempty
          fields: [actor_principal, actor_user]
      classification:
        temporary_path_contains:
        - /tmp/
        - /var/tmp/
        - /dev/shm/
        - '\temp\'
        - '%temp%'
        - '\windows\temp\'
        - '\appdata\local\temp\'
        user_writable_path_contains:
        - /tmp/
        - /var/tmp/
        - /dev/shm/
        - /home/
        - /users/
        - /downloads/
        - '\users\public\'
        - '\users\'
        - '\temp\'
        - '\appdata\'
        - '%temp%'
        - '%appdata%'
        - '\windows\temp\'
        - '\appdata\local\temp\'
        suspicious_path_contains:
        - /run/
        - /var/run/
        - /opt/
        - '\programdata\'
        - '\perflogs\'
        - '\recycler\'
        - '\windows\debug\'
        - '\intel\'
        system_binary_names: [svchost.exe, lsass.exe, explorer.exe, sshd, bash]
        command_names:
          compiler: [gcc, cc, make]
          shell: [sh, bash, cmd, cmd.exe, powershell, pwsh]
          network: [nc, netcat, ncat, socat, curl, wget, ftp, scp, sftp]
          archive: [tar, zip, 7z, rar, gzip]
        privileged_actors: [root, administrator, admin]
        suid_regex: '(?i)(?:chmod\s+4[0-7]{3}|chmod\s+u\+s|setuid|setgid|chown\s+root(?::root)?|suid)'
      decisions:
        from_tmp: {all: [temporary_path], any: [], none: []}
        from_user_writable: {all: [], any: [temporary_path, user_writable_path], none: []}
        suspicious_path: {all: [suspicious_path], any: [], none: [temporary_path, user_writable_path]}
        system_binary_in_user_path: {all: [system_binary_name], any: [temporary_path, user_writable_path, suspicious_path], none: []}
        compiler_activity: {all: [compiler_command], any: [], none: []}
        shell_spawn: {all: [shell_command], any: [], none: []}
        network_tool: {all: [network_command], any: [], none: []}
        archive_tool: {all: [archive_command], any: [], none: []}
        privileged_context: {all: [privileged_actor], any: [], none: []}
        new_suid_binary: {all: [suid_command], any: [], none: []}
      emissions:
        from_tmp:
          name: exec_from_tmp
          value: 1
          rule_id: EXEC_FROM_TMP
          description: Execution path indicates a temporary directory
          confidence: medium
        from_user_writable:
          name: exec_from_user_writable
          value: 1
          rule_id: EXEC_FROM_USER_WRITABLE
          description: Execution path indicates a user-writable location
          confidence: medium
        suspicious_path:
          name: exec_suspicious_path
          value: 1
          rule_id: EXEC_SUSPICIOUS_PATH
          description: Execution path indicates a suspicious location
          confidence: medium
        system_binary_in_user_path:
          name: exec_system_binary_in_user_path
          value: 1
          rule_id: EXEC_SYSTEM_BINARY_IN_USER_PATH
          description: System binary name executed from a suspicious or user-writable path
          confidence: medium
        compiler_activity:
          name: exec_compiler_activity
          value: 1
          rule_id: EXEC_COMPILER_ACTIVITY
          description: Compiler or build-tool activity observed
          confidence: medium
        shell_spawn:
          name: exec_shell_spawn
          value: 1
          rule_id: EXEC_SHELL_SPAWN
          description: Shell execution observed
          confidence: medium
        network_tool:
          name: exec_network_tool
          value: 1
          rule_id: EXEC_NETWORK_TOOL
          description: Network transfer tooling observed
          confidence: medium
        archive_tool:
          name: exec_archive_tool
          value: 1
          rule_id: EXEC_ARCHIVE_TOOL
          description: Archive tooling observed
          confidence: medium
        privileged_context:
          name: exec_privileged_context
          value: 1
          rule_id: EXEC_PRIVILEGED_CONTEXT
          description: Execution occurred in a privileged user context
          confidence: medium
        new_suid_binary:
          name: exec_new_suid_binary
          value: 1
          rule_id: EXEC_NEW_SUID_BINARY
          description: Privilege-escalation or SUID-related command semantics observed
          confidence: high
      evidence: [path, command, actor_user, derived_from]

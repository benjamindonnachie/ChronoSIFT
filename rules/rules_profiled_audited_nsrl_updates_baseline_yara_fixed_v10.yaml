    contextual_signal_adjustments:
      stage: contextual
      executor: ordered_signal_adjustments
      enabled: true
      phase: 35
      evidence_type: contextual
      inputs:
        command:
          resolver: concat
          fields: [actor_cmd, command_line, message]
          normalise: none
        combined_text_lower:
          resolver: concat
          fields: [actor_cmd, command_line, message]
          normalise: lower
        command_path_lower:
          resolver: concat
          fields: [actor_cmd, command_line, message]
          normalise: path_lower
      ordered_rules:
      - id: discovery_reclassification
        when:
          input: combined_text_lower
          op: contains_any
          values: [net view, 'nslookup ', resolve-dnsname, nltest /dclist, nltest.exe /dclist, ping -n 1, ping -c 1]
        signal_conditions:
          minimum_value_exclusive: 0
          required_any: [file_and_directory_discovery, remote_system_discovery, system_owner_user_discovery]
          forbidden_any: [lolbin_suspicious_args]
          preserved: [file_and_directory_discovery, remote_system_discovery, system_owner_user_discovery]
        target_signals: [lolbin_windows, lolbin_linux, exec_shell_spawn, exec_network_tool, execution_lolbin, suspicious_execution]
        action: {type: zero}
        explanation:
          rule_id: DISCOVERY_RECLASSIFICATION
          description: Read-only discovery command was reclassified from generic execution to explicit discovery semantics
          confidence: medium
        evidence: [dampened_signals, preserved_discovery_signals, command]
      - id: benign_admin_query_dampening
        when:
          all:
          - not: {input: combined_text_lower, op: regex, pattern: '&&|\|\||;'}
          - any:
            - all:
              - {input: combined_text_lower, op: contains_any, values: ['net user ']}
              - not: {input: combined_text_lower, op: contains_any, values: [' /add', ' /delete', ' /active:', ' /expires:', ' /passwordchg:', ' /passwordreq:', ' /times:', ' /comment:', ' /fullname:', ' /homedir:', ' /scriptpath:', ' /usercomment:']}
            - all:
              - {input: combined_text_lower, op: contains_any, values: [net localgroup]}
              - not: {input: combined_text_lower, op: contains_any, values: [' /add', ' /delete']}
            - all:
              - {input: combined_text_lower, op: contains_any, values: [cmd.exe /c klist]}
              - not: {input: combined_text_lower, op: contains_any, values: [' purge', ' add_bind', ' kcd_cache']}
            - all:
              - {input: combined_text_lower, op: contains_any, values: [schtasks /query, schtasks.exe /query, 'wmic ', ' reg query', 'reg query ', sc query, sc qc, sc queryex, wevtutil qe, get-mppreference, get-netfirewallprofile, get-service, get-scheduledtask, get-nettcpconnection, get-process, get-ciminstance, get-winevent, test-netconnection, netsh advfirewall show, tasklist, 'netstat ', 'ps aux | grep', 'ps -ef | grep', 'ipconfig ', route print, arp -a, net accounts, gpresult /r, whoami /groups, whoami /priv, cmd.exe /c klist, get-computerinfo, get-localuser, get-localgroup, get-hotfix, get-netipaddress, get-netroute, get-dnsclientcache, get-netneighbor, netsh interface ip show, query user, query session, qwinsta, quser, auditpol /get, 'net user ', net localgroup, uname -a, uname -r, uname -s, hostnamectl status, cat /etc/os-release, lsb_release -a, ifconfig -a]}
              - any:
                - {input: combined_text_lower, op: contains_any, values: [get-scheduledtask, get-nettcpconnection, get-process, get-ciminstance, get-winevent, test-netconnection, tasklist, 'netstat ', 'ps aux | grep', 'ps -ef | grep', 'ipconfig ', route print, arp -a, query user, query session, qwinsta, quser, auditpol /get, 'net user ', net localgroup, net accounts, gpresult /r, whoami /groups, whoami /priv, get-computerinfo, get-localuser, get-localgroup, get-hotfix, get-netipaddress, get-netroute, get-dnsclientcache, get-netneighbor, netsh interface ip show, uname -a, uname -r, uname -s, hostnamectl status, cat /etc/os-release, lsb_release -a, ifconfig -a]}
                - {input: combined_text_lower, op: contains_any, values: ['/query', ' query', ' list', ' get ', ' get-', ' qe ', 'enum ', ' /fo ', ' /v', ' show ', ' qc ', ' status', ' test-netconnection', ' | grep', ' /svc', ' -an', ' -ano', ' -a ']}
        signal_conditions:
          minimum_value_exclusive: 0
          forbidden_any: [lolbin_suspicious_args]
        target_signals: [lolbin_windows, exec_shell_spawn, exec_network_tool, data_transfer_tool_exec, transfer_execution, application_layer_protocol, file_and_directory_discovery, remote_system_discovery, system_owner_user_discovery, execution_lolbin, suspicious_execution]
        action: {type: zero}
        explanation:
          rule_id: BENIGN_ADMIN_QUERY_DAMPENING
          description: Query-only administrative command dampened generic LOLBin execution signals
          confidence: medium
        evidence: [signals, command]
      - id: benign_backup_archive_dampening
        when:
          all:
          - {input: command_path_lower, op: contains_any, values: ['tar ', 'zip ', '7z ', 'rar ', 'gzip ']}
          - {input: command_path_lower, op: contains_any, values: [/var/backups/, /backup/, ' backup', .bak, .tgz, .tar.gz, .zip]}
          - not: {input: command_path_lower, op: contains_any, values: ['login data', logins.json, key4.db, .kdbx, lsass, ntds.dit, sam.save, web.config]}
        signal_conditions:
          minimum_value_exclusive: 0
          forbidden_any: [password_store_access, credential_dumping, sensitive_file_access]
        target_signals: [lolbin_linux, exec_archive_tool, execution_lolbin, suspicious_execution]
        action: {type: zero}
        explanation:
          rule_id: BENIGN_BACKUP_ARCHIVE_DAMPENING
          description: Routine backup-style archive command dampened generic execution signals
          confidence: medium
        evidence: [signals, command]
      evidence:
        command: {resolver: input, input: command, max_chars: 240}
        signals: {resolver: changed_signals}
        dampened_signals: {resolver: changed_signals}
        preserved_discovery_signals: {resolver: preserved_positive_signals}
    systemd_service_persistence:
      stage: contextual
      executor: systemd_service_persistence
      enabled: true
      branch_mode: first_match
      branch_order: [artifact_change, command_activity]
      evidence_type: direct
      inputs:
        path:
          resolver: best_effort_file_path
          fields:
          - filename
          - relative_path
          - display_name
          - pathspec
          - link_target
        timestamp_kind:
          resolver: timestamp_desc_kind
          field: timestamp_desc
          kinds:
            priority: [create, delete, modify, access]
            contains:
              create: [create, creation, birth]
              delete: [delet]
              modify: [modif, change, content, mtime]
              access: [access, open, atime]
        combined_text:
          resolver: concat_lower
          fields:
          - actor_cmd
          - command_line
          - message
          first_existing:
          - actor_url
          - url
      branches:
        artifact_change:
          conditions:
            any:
            - all: [artifact_path, unit_extension, timestamp_kind]
          path_contains: [/etc/systemd/system/, /lib/systemd/system/, /usr/lib/systemd/system/, /etc/init.d/, '/system/currentcontrolset/services/']
          extension_in: [.service, .socket, .timer, .mount, .path]
          timestamp_kinds:
          - create
          - modify
          - delete
          description: Systemd unit artefact changed under a service manager path
          confidence: high
          evidence:
          - path
          - timestamp_desc
          - hostname
        command_activity:
          conditions:
            any:
            - all: [persistent_token]
            - all: [transient_token, unit_reference_extension]
            - all: [transient_token, unit_reference_path]
          persistent_tokens:
          - systemctl enable
          - systemctl link
          - systemctl preset
          - daemon-reload
          transient_tokens:
          - systemctl start
          - systemctl restart
          unit_reference_extensions: [.service, .socket, .timer, .mount, .path]
          unit_reference_path_tokens:
          - /etc/systemd/
          - /lib/systemd/system/
          - /usr/lib/systemd/system/
          - /run/systemd/system/
          description: Systemd enablement or unit-management semantics observed in command or log text
          confidence: medium
          evidence:
          - command
          - message
          - hostname
      emissions:
      - name: systemd_service_persistence
        value: 1
        rule_id: SYSTEMD_SERVICE_PERSISTENCE
      evidence:
        path:
          resolver: best_effort_file_path
          fields: [filename, relative_path, display_name, pathspec, link_target]
        timestamp_desc:
          resolver: row_field
          field: timestamp_desc
          max_chars: 120
        hostname: {resolver: row_field, field: hostname}
        command:
          resolver: first_nonempty
          fields: [actor_cmd, command_line, message, actor_url, url]
          max_chars: 240
        message:
          resolver: first_nonempty
          fields: [message, actor_url, url, actor_cmd, command_line]
          max_chars: 240
    download_to_execution:
      stage: temporal
      executor: signal_sequence_by_artifact
      enabled: true
      evidence_type: contextual
      lookback: 2h
      ordering: source_at_or_before_target
      window_bounds: closed
      source_selection: earliest_in_window
      emit_on: target
      key:
        scope: deadbox_global
        host_field: hostname
        artifact:
          resolver: best_effort_file_basename
          fields:
          - filename
          - relative_path
          - display_name
          - pathspec
          - link_target
      source:
        any_signals:
        - browser_download
        minimum_signal_value_exclusive: 0
      target:
        any_signals:
        - suspicious_execution
        - prefetch_execution
        - amcache_execution
        - execution_lolbin
        - execution_interpreter
        minimum_signal_value_exclusive: 0
      emissions:
      - name: user_execution_after_download
        value: 1
        rule_id: USER_EXECUTION_AFTER_DOWNLOAD
        description: Downloaded item was executed within a bounded window
        confidence: medium
      - name: ingress_tool_transfer
        value: 1
        rule_id: INGRESS_TOOL_TRANSFER
        description: Downloaded or retrieved tool was subsequently executed
        confidence: medium
      evidence:
      - filename
      - download_timestamp
      - execution_timestamp
      - hostname
    canonical_authentication:
      stage: atomic
      executor: canonical_authentication
      enabled: true
      evidence_type: direct
      inputs:
        fields:
          outcome: auth_outcome
          protocol: auth_protocol
          direction: auth_direction
          logon_type: logon_type
          message: message
          authentication_package: authentication_package
        source_signals:
          success: [auth_success_generic, ssh_success, rdp_success]
          failure: [auth_fail_generic, ssh_fail, rdp_fail]
          minimum_signal_value_exclusive: 0
      outcomes:
        success: success
        failure: failure
        outcome_source_match: any
        conflict_resolution: allow_both
      semantics:
        remote:
          match: any
          direction_values: [remote]
          protocol_values: [ssh, rdp, windows-network]
        remote_interactive:
          match: any
          protocol_values: [rdp]
          logon_types: ['10']
        remote_shell:
          protocol_values: [ssh]
        invalid_user:
          message_contains: [invalid user, unknown user]
        new_credentials:
          logon_types: ['9']
        service_logon:
          logon_types: ['4', '5']
        ntlm_remote:
          authentication_packages: [ntlm]
        lateral_movement:
          include_remote: true
          logon_types: ['3', '10']
          authentication_packages: [ntlm]
          minimum_matches: 2
      eligibility: {all: [], any: [success, failure], none: []}
      decisions:
        success: {all: [success], any: [], none: []}
        failure: {all: [failure], any: [], none: []}
        remote_success: {all: [success, remote], any: [], none: []}

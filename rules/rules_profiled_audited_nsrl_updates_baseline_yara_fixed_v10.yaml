              any:
              - all:
                - {input: event_identifier, op: equals_any, values: ['5140', '5145']}
                - any:
                  - {input: share_lower, op: contains_any, values: ['\\c$', '\\admin$', '\\ipc$', /admin$, /ipc$]}
                  - {input: share_lower, op: ends_with_any, values: ['\c$', '\admin$', '\ipc$', '\print$', '\netlogon', '\sysvol']}

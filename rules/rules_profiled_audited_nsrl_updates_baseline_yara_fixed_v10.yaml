detector_policy:
  version: 1
  mode: authoritative
  detectors:
    geographic_continuity:
      stage: temporal
      executor: geographic_continuity
      enabled: true
      evidence_type: contextual
      inputs:
        key_fields: [actor_principal]
        success_signals: [auth_remote_success]
        minimum_signal_value_exclusive: 0
        country_field: geo_country_iso
        asn_field: geo_asn
        city_field: geo_city_name
        ip_fields: [src_ip, ip_address]
      history:
        retention: lifetime
        novelty_reference: all_seen
        mark_first_observation: true
        emit_first_observation: false
        boundary_reference: previous_observation
      output_fields:
        new_country: geo_new_country
        new_asn: geo_new_asn
        new_city: geo_new_city
        boundary_crossing: geo_boundary_crossing
      emissions:
        new_country:
          name: new_country
          value: 1
          rule_id: NEW_COUNTRY
          description: Successful remote authentication from a country not previously seen for the actor
          confidence: high
        new_asn:
          name: new_asn
          value: 1
          rule_id: NEW_ASN
          description: Successful remote authentication from an ASN not previously seen for the actor
          confidence: high
        new_city:
          name: new_city
          value: 1
          rule_id: NEW_CITY
          description: Successful remote authentication from a city not previously seen for the actor
          confidence: medium
        boundary_crossing:
          name: boundary_crossing
          value: 1
          rule_id: BOUNDARY_CROSSING
          description: Consecutive successful remote authentications crossed a country boundary for the same actor
          confidence: high
      evidence:
        new_country:
          geo_country_iso: {resolver: current_country}
          previous_countries: {resolver: previous_countries, max_chars: 240}
          ip_address: {resolver: current_ip}
          key_by: {resolver: key_fields}
          actor_key: {resolver: actor_key}
        new_asn:
          geo_asn: {resolver: current_asn}
          previous_asns: {resolver: previous_asns, max_chars: 240}
          ip_address: {resolver: current_ip}
          key_by: {resolver: key_fields}
          actor_key: {resolver: actor_key}
        new_city:
          geo_city_name: {resolver: current_city}
          geo_country_iso: {resolver: current_country}
          previous_cities: {resolver: previous_cities, max_chars: 240}
          ip_address: {resolver: current_ip}
          key_by: {resolver: key_fields}
          actor_key: {resolver: actor_key}
        boundary_crossing:
          from_country: {resolver: previous_country}
          to_country: {resolver: current_country}
          from_ip: {resolver: previous_ip}
          to_ip: {resolver: current_ip}
          key_by: {resolver: key_fields}
          actor_key: {resolver: actor_key}
    impossible_travel:
      stage: temporal
      executor: impossible_travel
      enabled: true
      evidence_type: contextual
      inputs:
        key_fields: [actor_principal]
        success_signals: [auth_remote_success]
        minimum_signal_value_exclusive: 0
        latitude_field: geo_latitude
        longitude_field: geo_longitude
        country_field: geo_country_iso
        ip_fields: [src_ip, ip_address]
      state:
        reference_selection: retained_reference
        rejected_observation_update: retain_reference
        qualifying_comparison_update: update_reference
      thresholds:
        minimum_distance_km: 200
        minimum_distance_comparison: greater_than_or_equal
        minimum_time_seconds: 60
        minimum_time_comparison: greater_than_or_equal
        velocity_kmh: 900
        velocity_comparison: greater_than_or_equal
      output_fields:
        distance_km: travel_distance_km
        dt_hours: travel_dt_hours
        velocity_kmh: travel_velocity_kmh
        from_country: travel_from_country
        to_country: travel_to_country
        from_ip: travel_from_ip
      emissions:
        impossible_travel:
          name: impossible_travel
          value: 1
          rule_id: IMPOSSIBLE_TRAVEL
          description: Velocity exceeds threshold between consecutive successful logons for same actor
          confidence: high
      evidence:
        distance_km: {resolver: distance_km, round_digits: 3}
        dt_hours: {resolver: dt_hours, round_digits: 4}
        velocity_kmh: {resolver: velocity_kmh, round_digits: 1}
        from_ip: {resolver: previous_ip}
        to_ip: {resolver: current_ip}
        from_country: {resolver: previous_country}
        to_country: {resolver: current_country}
        threshold_kmh: {resolver: velocity_threshold_kmh}
        min_distance_km: {resolver: minimum_distance_km}
        key_by: {resolver: key_fields}
        actor_key: {resolver: actor_key}
    ip_scope_continuity:
      stage: temporal
      executor: ip_scope_continuity
      enabled: true
      evidence_type: contextual
      inputs:
        key_fields: [actor_principal]
        ip_fields: [src_ip, ip_address]
      history:
        reference_selection: retained_reference
        state_update: every_valid_observation
      lookback:
        duration: 24h
        window_bounds: closed
      conditions:
        require_address_change: true
      subnet_prefixes:
        ipv4_prefix_length: 24
        ipv6_prefix_length: 64
      branch_mode: all_matches
      transition_rules:
      - id: private_address_change
        previous_scope: private
        current_scope: private
        subnet_change: any
        emission: changed_private_ip
      - id: private_subnet_change
        previous_scope: private
        current_scope: private
        subnet_change: required
        emission: crossed_private_subnet
      - id: private_to_public
        previous_scope: private
        current_scope: public
        subnet_change: any
        emission: private_to_public
      - id: public_to_private
        previous_scope: public
        current_scope: private
        subnet_change: any
        emission: public_to_private
      emissions:
        changed_private_ip:
          name: user_changed_private_ip
          value: 1
          rule_id: USER_CHANGED_PRIVATE_IP
          description: Same actor observed from a different private IP within continuity window
          confidence: low
        crossed_private_subnet:
          name: user_crossed_private_subnet
          value: 1
          rule_id: USER_CROSSED_PRIVATE_SUBNET
          description: Same actor crossed private subnet within continuity window
          confidence: medium
        private_to_public:
          name: user_private_to_public_ip
          value: 1
          rule_id: USER_PRIVATE_TO_PUBLIC_IP
          description: Same actor moved from private to public IP within continuity window
          confidence: low
        public_to_private:
          name: user_public_to_private_ip
          value: 1
          rule_id: USER_PUBLIC_TO_PRIVATE_IP
          description: Same actor moved from public to private IP within continuity window
          confidence: low
      evidence:
        changed_private_ip:
          actor_principal: {resolver: actor_key}
          previous_ip: {resolver: previous_ip}
          current_ip: {resolver: current_ip}
          delta_seconds: {resolver: delta_seconds}
        crossed_private_subnet:
          actor_principal: {resolver: actor_key}
          previous_ip: {resolver: previous_ip}
          current_ip: {resolver: current_ip}
          delta_seconds: {resolver: delta_seconds}
          previous_subnet: {resolver: previous_subnet}
          current_subnet: {resolver: current_subnet}
        private_to_public:
          actor_principal: {resolver: actor_key}
          previous_ip: {resolver: previous_ip}
          current_ip: {resolver: current_ip}
          delta_seconds: {resolver: delta_seconds}
          previous_scope: {resolver: previous_scope}
          current_scope: {resolver: current_scope}
        public_to_private:
          actor_principal: {resolver: actor_key}
          previous_ip: {resolver: previous_ip}
          current_ip: {resolver: current_ip}
          delta_seconds: {resolver: delta_seconds}
          previous_scope: {resolver: previous_scope}
          current_scope: {resolver: current_scope}
    clamav_classification:

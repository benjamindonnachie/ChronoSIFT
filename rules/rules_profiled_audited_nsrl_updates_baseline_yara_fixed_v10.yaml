profiling:
  hour_of_week:
    enabled: true
    smoothing_alpha: 1
    quiet_quantile: 0.1
    min_profile_events: 100
    parser_field: parser
    filename_field: filename
    nsrl_is_os_component_field: nsrl_is_os_component
    nsrl_application_type_field: nsrl_application_type
    nsrl_exclusion_combine: any_available
    include_parser_regex: '(?:mft|usnjrnl|filestat)'
    insufficient_filtered_events: full_dataset
    exclude_nsrl_application_type_contains:
    - Operating System
    exclude_parser_contains:
    - apt_history
    - dpkg
    exclude_filename_contains:
    - WinSxS
    - SoftwareDistribution
    hour_of_week_field: hour_of_week
    rarity_signal: hour_rarity
    quiet_signal: quiet_time_event
    rarity_score_field: chronosift_hour_rarity_score
    emit_hour_rarity_signal: false
    emit_quiet_time_signal: false
    rarity_signal_merge: maximum
    quiet_signal_value: 1
    quiet_signal_merge: maximum
    rarity_explanation:
      rule_id: HOUR_RARITY
      description: Dataset activity profile rarity contributed to score
      confidence: low
      evidence_type: profiling
      evidence: [score_column, rarity_column]
    quiet_explanation:
      rule_id: QUIET_TIME_EVENT
      description: Event occurred during a configured quiet profile hour
      confidence: low
      evidence_type: profiling
      evidence: [hour_of_week, quiet_quantile]
    multiplier_explanation:
      description: Profile multiplier applied (m = 1 + k * hour_rarity)
      confidence: medium
      evidence_type: profiling
      evidence: [hour_rarity, k, multiplier, signals, targets]
profile_multipliers:
- id: QUIET_TIME_PRIV
  applies_to_signals:
  - privileged_login
  k: 0.5
- id: QUIET_TIME_BOUNDARY
  applies_to_signals:
  - boundary_crossing
  - new_country
  - new_asn
  - new_city
  k: 0.5
- id: QUIET_TIME_PERSIST
  applies_to_signals:
  - persistence_service
  - persistence_scheduled_task
  - persistence_runkey
  - account_or_group_change
  k: 0.75
- id: QUIET_TIME_LOLBIN
  applies_to_signals:
  - lolbin_linux
  - lolbin_windows
  - lolbin_suspicious_args
  k: 0.75
- id: QUIET_TIME_EXFIL
  applies_to_signals:
  - large_archive_created
  - staging_then_transfer
  - sensitive_data_staged
  - cross_border_transfer
  - archive_after_sensitive_access
  k: 0.75
geoip_enrichment:
  outputs:
    city_geoname_id: geo_city_geoname_id
    city_name: geo_city_name
    country_iso: geo_country_iso
    latitude: geo_latitude
    longitude: geo_longitude
    asn: geo_asn
canonicalisation:
  excluded_networks: [0.0.0.0/32, 127.0.0.0/8, '::/128', '::1/128']
  windows_authentication:
    output_merge: preserve_existing
    selector:
      parser_field: parser
      parser_prefixes: [winevt, winevtx]
      xml_field: xml_string
    placeholders:
    - '-'
    - '::1'
    - 127.0.0.1
    - 0.0.0.0
    - '::'
    - local
    - localhost
    - local machine
    fields:
    - id: event_identifier
      output_field: event_identifier
      event_data_aliases: [EventID]
      system_source: event_id
    - id: logon_type
      output_field: logon_type
      event_data_aliases: [LogonType]
      system_source: none
    - id: client_address
      output_field: client_address
      event_data_aliases: [ClientAddress, ClientIP, IpAddress, RemoteAddress, RemoteIP]
      system_source: none
    - id: source_network_address
      output_field: source_network_address
      event_data_aliases: [SourceNetworkAddress, NetworkAddress, SourceIP, SrcIP, PeerAddress]
      system_source: none
    - id: workstation_name
      output_field: workstation_name
      event_data_aliases: [WorkstationName, Workstation]
      system_source: none
    - id: authentication_package
      output_field: authentication_package
      event_data_aliases: [AuthenticationPackageName, AuthenticationPackage]
      system_source: none
    - id: logon_process
      output_field: logon_process
      event_data_aliases: [LogonProcessName, LogonProcess]
      system_source: none
    - id: provider_name
      output_field: provider_name
      event_data_aliases: [ProviderName]
      system_source: provider
    - id: event_channel
      output_field: event_channel
      event_data_aliases: [Channel]
      system_source: channel
    - id: target_user_name
      output_field: target_user_name
      event_data_aliases: [TargetUserName]
      system_source: none
    - id: target_domain_name
      output_field: target_domain_name
      event_data_aliases: [TargetDomainName]
      system_source: none
    - id: subject_user_name
      output_field: subject_user_name
      event_data_aliases: [SubjectUserName]
      system_source: none
    - id: subject_domain_name
      output_field: subject_domain_name
      event_data_aliases: [SubjectDomainName]
      system_source: none
    - id: group_name
      output_field: group_name
      event_data_aliases: [GroupName]
      system_source: none
    - id: member_name
      output_field: member_name
      event_data_aliases: [MemberName, Member]
      system_source: none
    - id: share_name
      output_field: share_name
      event_data_aliases: [ShareName]
      system_source: none
    - id: share_local_path
      output_field: share_local_path
      event_data_aliases: [ShareLocalPath]
      system_source: none
    - id: relative_target_name
      output_field: relative_target_name
      event_data_aliases: [RelativeTargetName, RelativePathName]
      system_source: none
    - id: rdp_session_name
      output_field: rdp_session_name
      event_data_aliases: [SessionName]
      system_source: none
    - id: logon_id
      output_field: logon_id
      event_data_aliases: [TargetLogonId, LogonId, LogonGuid]
      system_source: none
    - id: session_id
      output_field: session_id
      event_data_aliases: [SessionId, SessionIdentifier]
      system_source: none
    - id: new_process_name
      output_field: new_process_name
      event_data_aliases: [NewProcessName]
      system_source: none
    - id: parent_process_name
      output_field: parent_process_name
      event_data_aliases: [ParentProcessName, ParentImage, CreatorProcessName]
      system_source: none
    - id: command_line
      output_field: command_line
      event_data_aliases: [CommandLine, ProcessCommandLine]
      system_source: none
    - id: parent_command_line
      output_field: parent_command_line
      event_data_aliases: [ParentCommandLine]
      system_source: none
    client_address:
      source_field_ids: [client_address, source_network_address]
      output_field: rdp_client_address
      source_ip_output_field: src_ip
    classifications:
      event_identifier_field_id: event_identifier
      logon_type_field_id: logon_type
      outcome_output_field: auth_outcome
      outcomes:
      - event_ids: ['4624', '1149', '4778']
        value: success
      - event_ids: ['4625', '4779']
        value: failure
      direction_output_field: auth_direction
      remote_direction_value: remote
      remote_direction_condition: client_address_present
      protocol_output_field: auth_protocol
      protocol_branch_mode: first_match
      protocols:
      - event_ids: ['1149']
        logon_types: []
        match: any
        require_client_address: false
        value: rdp
      - event_ids: []
        logon_types: ['10']
        match: any
        require_client_address: false
        value: rdp
      - event_ids: []
        logon_types: ['3']
        match: any
        require_client_address: true
        value: windows-network
    null_output_fields: [dst_ip]
  ssh_authentication:
    output_merge: preserve_existing
    selector:
      parser_field: parser
      parser_values: [systemd_journal, syslog, text/syslog_traditional]
      message_field: message
      message_regex: '(?i)\bsshd\b'
      match: any
    escaped_control_regex: '(?i)(?:\\r|\\n|\\t)+'
    outputs:
      actor_user_auth: ssh_actor_user_auth
      actor_user_session: ssh_actor_user_session
      auth_method: ssh_auth_method
      source_ip: src_ip
      destination_ip: dst_ip
      protocol: auth_protocol
      direction: auth_direction
      outcome: auth_outcome
      session_id: session_id
      logon_id: logon_id
    values:
      protocol: ssh
      direction: remote
      success_outcome: success
      failure_outcome: failure
    patterns:
    - id: accepted
      regex: '(?i)\baccepted\s+([a-z0-9_-]+(?:/[a-z0-9_-]+)?)\s+for\s+([A-Za-z0-9._$@-]+)\s+from\s+([0-9A-Fa-f:.]+)'
      outcome: success
      groups: {auth_method: 1, actor_user_auth: 2, source_ip: 3}
      require_message_selector: false
    - id: failed
      regex: '(?i)\bfailed\s+([a-z0-9_-]+(?:/[a-z0-9_-]+)?)\s+for(?:\s+invalid\s+user)?\s+([A-Za-z0-9._$@-]+)\s+from\s+([0-9A-Fa-f:.]+)'
      outcome: failure
      groups: {auth_method: 1, actor_user_auth: 2, source_ip: 3}
      require_message_selector: false
    - id: invalid_user
      regex: '(?i)\binvalid user\s+([A-Za-z0-9._$@-]+)\s+from\s+([0-9A-Fa-f:.]+)'
      outcome: failure
      groups: {actor_user_auth: 1, source_ip: 2}
      require_message_selector: false
    - id: session_opened
      regex: '(?i)\bsession opened for user\s+([A-Za-z0-9._$@-]+)\b'
      outcome: success
      groups: {actor_user_session: 1}
      require_message_selector: true
  pivot_destination:
    outputs:
      identity: pivot_dest_key
      ip: destination_ip
      fqdn: destination_fqdn
      hostname: destination_hostname
    sources:
      ip: [destination_ip, dst_ip, dest_ip, server_ip, target_ip]
      fqdn: [destination_fqdn, dest_fqdn, target_fqdn, fqdn, server_name, dns_name]
      hostname: [destination_hostname, dest_hostname, target_hostname, hostname, host_name, computer_name, workstation_name]
    precedence:
    - {role: ip, prefix: 'ip:'}
    - {role: fqdn, prefix: 'fqdn:'}
    - {role: hostname, prefix: 'host:'}
    auth_like_any_fields: [auth_protocol, auth_direction, event_identifier, logon_type]
  ip_recovery:
    output_field: ip_address
    parser_field: parser
    windows_parser_prefixes: [winevt, winevtx]
    context_regex: '(?i)(?:ftp://|sftp://|scp://|http://|https://|smb://|cifs://|rdp://|ssh://|\bhost\s*:|\bclient\b|\bremote\b|\bfrom\b|\bto\b|\bsrc\b|\bdst\b|\bconnect(?:ed)?\b|\blogon\b|\bauth\b)'
    sources:
    - kind: windows_fields
      fields: [rdp_client_address, client_address, source_network_address]
    - kind: windows_xml
      fields: [xml_string]
    - kind: windows_strings
      fields: [strings]
    - kind: text_fields
      fields: [url, http_request, http_headers, http_request_referer, http_request_user_agent]
      require_context: false
    - kind: text_fields
      fields: [message, text]
      require_context: true
